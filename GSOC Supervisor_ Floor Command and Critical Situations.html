ecords the contact, channel, and time (SOP-GSOC-008, SOP-GSOC-012)."},{"t":"02:31 Subjects departed westbound on foot. No property loss observed."},{"t":"Evidence: clip saved.","f":"Every clip is referenced by its identifier and timestamp (SOP-GSOC-008)."},{"t":"Final disposition: [blank]","f":"No field is left blank without an explicit not applicable and a reason, and a disposition can’t be not applicable anyway (SOP-GSOC-008)."}],"verdict":{"q":"Approve or return?","o":[{"t":"Approve. It’s mostly fine and the outcome was good.","w":"A good outcome doesn’t make a deficient record defensible."},{"t":"Return it with the seven deficiencies listed specifically.","w":"Approve or return with specified deficiencies. Those are the two options (SOP-GSOC-008)."},{"t":"Fix it yourself and close it.","w":"Every entry is attributed to a named person. Rewriting someone else’s entries hides the defect from QA and muddies who recorded what (Appendix E)."},{"t":"Approve it and bring the issues up in coaching later.","w":"The record you approved is the one that gets read in a dispute."}],"a":1}}},{"h":"Late, reconstructed, or falsified"},{"p":"These three look alike on a screen and are handled completely differently. An honest late entry, showing its real entry time and the reason, is a deviation. You review it before closure. Entries back-loaded after a declared incident-system outage, marked reconstructed with their original times, are exactly what SOP-GSOC-013 requires. Changing an entry’s time so a late entry looks live is backdating, and backdating is falsification."},{"act":{"id":"u6d","type":"decide","title":"Which one is it?","intro":"Four records from the same week. Sort out what you’re looking at.","cards":[{"s":"Jordan added a 02:14 call attempt at 02:40. The entry shows its real entry time and a note: “late entry, call made while briefing officer.”","o":[{"t":"A recorded deviation. Review it before closure","ok":true,"w":"Deviations are recorded at the time, with the reason, by the person who deviated, and you review each one before closure (A8)."},{"t":"Falsification","w":"Nothing’s hidden. The real entry time is right there."},{"t":"Delete it, since it wasn’t contemporaneous","w":"An attempted contact is materially relevant. Deleting it would be the real problem."}]},{"s":"On another record, the entry time field was edited so a 02:40 entry reads 02:14.","o":[{"t":"Coach Jordan on contemporaneous logging","w":"Backdating is falsification, and it isn’t treated as a training matter (A8)."},{"t":"Remove him from the floor, report it to the SOP Lead and Program Director within the shift, start decertification, and leave the record as it is","ok":true,"w":"Falsification means immediate removal and decertification the same shift. Don’t correct the entry, because that would destroy the evidence of what happened (A8, SOP-GSOC-002)."}]},{"s":"The incident system was down from 03:40 to 04:55. Afterward, entries were back-loaded with their original times and marked reconstructed.","o":[{"t":"Correct procedure","ok":true,"w":"That’s exactly what SOP-GSOC-013 and SOP-GSOC-008 require during degraded documentation."},{"t":"A deviation to review","w":"It isn’t a deviation. It’s the procedure."},{"t":"Falsification","w":"The original times are preserved and the entries are marked. Nothing is disguised."}]},{"s":"No outage tonight. Marcus wrote his whole 01:00 to 04:00 timeline from memory at 06:15.","o":[{"t":"Approve it, the times look about right","w":"End-of-shift reconstruction isn’t acceptable and is visible to QA. The contemporaneity KPI measures exactly this gap (SOP-GSOC-008)."},{"t":"Return it, have the deviation recorded with the reason, and coach. If it repeats, it goes to retraining","ok":true,"w":"Repeated deviation triggers retraining and can lead to decertification (A8)."}]}]}},{"h":"Legal hold starts on the floor"},{"p":"On any indication of litigation, an insurance claim, or a law-enforcement request, the hold goes on immediately and you’re told. Routine deletion stops from that moment. Nobody waits for a formal letter, and a police response is already presumptive grounds. The Program Director records the hold in the register and is the only person who can release it, in writing."},{"act":{"id":"u6k","type":"check","title":"Check yourself","qs":[{"q":"06:40, end of a brutal night, 14 records waiting. The incoming supervisor suggests letting operators self-close the routine Level 1s. Your answer?","o":[{"t":"Yes, but only for Level 1.","w":"There’s no level exemption. An operator doesn’t close their own incident (SOP-GSOC-008)."},{"t":"No. Review is never waived for a busy shift. Unreviewed records hand over as open items.","w":"The control has no busy-shift clause. Whatever you can’t review goes to the next Supervisor open, with its status."},{"t":"Yes, if a second operator checks each one.","w":"Closure is a supervisory act, not a peer one."},{"t":"Close them all now and review them tomorrow.","w":"That’s closure without review, which is the thing the control prevents."}],"a":1,"r":"SOP-GSOC-008"},{"q":"What gets recorded when you close a record?","o":[{"t":"Just the final disposition.","w":"The disposition is the operator’s. Your closure needs its own entry."},{"t":"Your identity as the reviewing Supervisor, and the closure time.","w":"That’s the closure record (SOP-GSOC-008, Appendix E)."},{"t":"The operator’s signature.","w":"The operator submits. You close."},{"t":"The client’s acknowledgement.","w":"Clients don’t sign off on GSOC records."}],"a":1,"r":"SOP-GSOC-008"},{"q":"This month you’ve returned nine records for missing alternate-contact attempts, across six operators. What does that pattern tell you?","o":[{"t":"Six operators need discipline.","w":"Blaming individuals for a systemic defect guarantees the defect persists (SOP-GSOC-015)."},{"t":"It’s probably a procedure or training defect. Route it to the SOP Lead or Learning and Development.","w":"Findings that recur across operators are treated as a manual or training defect, not a discipline matter (SOP-GSOC-015)."},{"t":"Review needs to get stricter.","w":"Your review caught it. The question is why six people miss the same step."},{"t":"Nothing. Returns are normal.","w":"A pattern across operators is exactly what QA trending exists to surface."}],"a":1,"r":"SOP-GSOC-015"}]}}]},{"id":"u7","n":7,"short":"Dispatch, emergency, client","title":"Dispatch, emergency services, and the client","refs":["SOP-GSOC-010","SOP-GSOC-011","SOP-GSOC-012","Call Protocol: Management"],"lede":"Three different calls go out from your floor: to the officer, to emergency services, and to the client. Operators make the first two. The third is yours at Level 4, and when either of the first two fails, it comes back to you.","blocks":[{"h":"The officer brief"},{"p":"The officer is walking into a situation the operator can see and they can’t. That makes the quality of the brief a safety control. It goes in a fixed order, it says plainly what hasn’t been established, and it ends with a read-back. During the response the operator keeps watching and updating the officer on subject movement. Talk-down is used only where the annex authorizes it. [CONFIRM] talk-down authorization per site."},{"ctrl":"An officer is never dispatched into a verified life-safety situation as the sole response. Emergency services are engaged in parallel, not after the officer reports back.","src":"SOP-GSOC-010"},{"act":{"id":"u7o","type":"order","title":"Build the brief","intro":"SOP-GSOC-010 gives the brief a fixed order. Put these in it.","steps":[{"t":"Site and precise location within the site","w":"Where to go comes first."},{"t":"Nature of the event","w":"What’s happening, in plain language."},{"t":"Number of subjects"},{"t":"Whether any weapon or threat has been observed"},{"t":"Direction of travel"},{"t":"Any hazard: animals, vehicles, environmental conditions"},{"t":"What has not been established","w":"“No weapon observed” isn’t “no weapon present.” Say which one it is."},{"t":"Read-back of the location and the nature of the event","w":"Confirms the officer actually heard it."}]}},{"h":"When dispatch fails"},{"act":{"id":"u7d","type":"decide","title":"Failed dispatch","intro":"Each of these comes back to you. What’s the move?","cards":[{"s":"Both the primary and alternate officer contacts go unanswered on a verified event, no threat to anyone.","o":[{"t":"Level 2 to you, with every attempt timestamped","ok":true,"w":"Both unreachable is an immediate Level 2, and every attempt goes in the record (SOP-GSOC-010)."},{"t":"Wait five minutes and try again","w":"That’s waiting out a failed dispatch."},{"t":"Email the guard company","w":"Email is never for urgent matters (SOP-GSOC-012)."}]},{"s":"The officer answers and says he won’t go into the yard alone at night.","o":[{"t":"Record his stated reason word for word and escalate to Level 2","ok":true,"w":"Officer declines or can’t respond: reason recorded verbatim, Level 2 (SOP-GSOC-010)."},{"t":"Order him to respond","w":"Officer employment and supervision sit outside the GSOC’s scope (SOP-GSOC-010). Your tools are escalation and the client’s decision."},{"t":"Log “officer declined” and move on","w":"The reason has to be recorded verbatim."}]},{"s":"The officer hasn’t reported back within the site’s report-back interval and doesn’t answer a call. [CONFIRM] report-back interval.","o":[{"t":"Treat officer welfare as a potential life-safety matter and escalate to Level 5","ok":true,"w":"That’s the rule for a silent officer after a contact attempt (SOP-GSOC-010)."},{"t":"Assume he’s busy on scene and keep waiting","w":"An assumption, made about the one person you’ve sent toward the problem."},{"t":"Message him and check again at the next sweep","w":"A text and a sweep cycle is a long time to not know whether your officer’s hurt."}]},{"s":"An unauthorized vehicle is parked inside a closed yard with nobody around it. The site has no officer assigned.","o":[{"t":"Level 4: get a client decision on response","ok":true,"w":"No officer assigned goes to Level 4 for the client to decide (SOP-GSOC-010)."},{"t":"Close it as unable to dispatch","w":"That’s dropping a verified event."},{"t":"Send an officer from a different client’s site","w":"Not in scope, and not your call."}]}]}},{"h":"Emergency services"},{"p":"On a verified life-safety threat the operator calls without delay. No supervisor approval first, no waiting for dispatch to complete, no waiting for more verification. Under the KD-1 decisions operators use the site’s emergency dispatch number from the Program Annex rather than dialing 911 from the floor. A 911 call routes by the caller’s location, so from the floor it reaches the dispatch center covering Plano or Atlanta, not the one covering the site."},{"p":"The call covers the full street address and the best access point, what’s happening in plain language, subjects in objective terms, whether a weapon has been observed (saying so explicitly when it hasn’t), injuries, the fact that the caller is a remote operator watching by camera, and a callback number that will be answered for the whole incident. In a verified-response jurisdiction, the operator says plainly that the event is visually verified and being observed live. [CONFIRM] which sites sit in verified-response or alarm-permit jurisdictions."},{"p":"Afterward: the agency’s unit or incident number goes in the record, a legal hold goes on, and any fatality, serious injury, media presence, or likely public exposure goes to Level 6."},{"h":"Level 4 is yours"},{"p":"Notify promptly. A client who learns about an incident at their own site from anyone other than the GSOC is a failure of this procedure, however well the incident itself was handled. Say what’s known, what isn’t known yet, what the GSOC has done, and what happens next. Never speculate on cause, liability, or loss value, and never commit the client to a course of action."},{"ctrl":"Urgency is never communicated by a channel that does not guarantee an immediate human response. A time-critical matter is spoken, not written.","src":"SOP-GSOC-012"},{"act":{"id":"u7s","type":"sort","title":"Say it or don’t","intro":"Lines you might use on a Level 4 call. Which belong in it?","bins":[{"id":"say","label":"Say it"},{"id":"no","label":"Don’t say it"}],"items":[{"t":"“This is the Supervisor at the Specialized GSOC, calling about site S-2210.”","b":"say","w":"Identify yourself, your role, and the site first (SOP-GSOC-012)."},{"t":"“Two people entered the yard at 02:14. An officer is on scene and police were called at 02:16.”","b":"say","w":"Lead with the most important facts, stated as facts."},{"t":"“We haven’t confirmed yet whether anything was taken.”","b":"say","w":"What isn’t known is part of the notification."},{"t":"“It looks like they got away with about eight thousand dollars of copper.”","b":"no","w":"Never speculate on loss value (SOP-GSOC-012)."},{"t":"“This probably happened because your staff left the gate unlocked.”","b":"no","w":"Never speculate on cause or liability."},{"t":"“You’ll want to press charges on this one.”","b":"no","w":"Never commit the client to a course of action."},{"t":"“We’ll update you by 03:00, or sooner if anything changes.”","b":"say","w":"What happens next."},{"t":"“Our north lot cameras have been down since 01:00, so we can’t see that area.”","b":"say","w":"Telling the client what isn’t being monitored is required, not optional (SOP-GSOC-013)."}]}},{"h":"Calls you’ll receive"},{"p":"Media, insurers, attorneys, and members of the public get no information. Route them to the Program Director without exception, and without confirming any detail, including whether an incident happened at all. Law-enforcement requests outside a live emergency also go to the Program Director. Client staff who aren’t on the authorized contact list are verified with an authorized contact before anything is shared. Every enquiry gets recorded, including the ones you refused."},{"p":"The management call protocol adds a few floor rules. An urgent concern from management is documented immediately and reaches you within five minutes. Personnel or policy matters go to you and HR, handled carefully as potential legal matters, with no opinions offered. Nobody promises an outcome. You can promise when they’ll hear back."},{"act":{"id":"u7k","type":"check","title":"Check yourself","qs":[{"q":"Why do operators use the site’s emergency dispatch number from the annex instead of dialing 911 from the floor?","o":[{"t":"911 is slower to answer.","w":"Speed isn’t the reason."},{"t":"A 911 call routes by the caller’s location, so from the floor it reaches the wrong dispatch center.","w":"The floor is in Plano or Atlanta. The site’s local center is the one that can send help (KD-1, Program Annex)."},{"t":"Clients prefer it.","w":"Client preference doesn’t set emergency procedure."},{"t":"911 won’t take calls from monitoring companies.","w":"That isn’t the issue."}],"a":1,"r":"KD-1 decision"},{"q":"A caller says she’s a reporter and asks whether police went to a client site last night. What can the floor say?","o":[{"t":"“No comment on an active investigation.”","w":"That confirms there’s something to investigate."},{"t":"Nothing about it, including whether anything happened. Take her details and route them to the Program Director.","w":"No detail confirmed, including whether an incident occurred, and the enquiry is recorded (SOP-GSOC-012)."},{"t":"Confirm only that police attended.","w":"Any confirmation is a detail."},{"t":"Refer her to the client.","w":"External enquiries go to the Program Director without exception."}],"a":1,"r":"SOP-GSOC-012"},{"q":"A man says he’s the client’s new district manager and wants the incident summary read to him now. He isn’t on the authorized contact list.","o":[{"t":"Share it if he can quote the incident number.","w":"Knowing a number isn’t authorization."},{"t":"Verify him with an authorized contact before sharing anything.","w":"Client personnel not on the list are verified first (SOP-GSOC-012)."},{"t":"Read it to him. He’s client staff.","w":"You don’t know that yet."},{"t":"Email it to his company address.","w":"Still unverified, and now in writing."}],"a":1,"r":"SOP-GSOC-012"},{"q":"A management caller raises an urgent concern about a site. Under the management call protocol, how fast does it reach you?","o":[{"t":"By end of shift.","w":"That’s the routine-update timeline."},{"t":"Within five minutes, documented immediately, with no promise of resolution.","w":"That’s the urgent-concern handling in the protocol."},{"t":"Within the hour.","w":"Too slow for urgent."},{"t":"Next business day.","w":"Not for urgent."}],"a":1,"r":"Call Protocol: Management"}]}}]},{"id":"u8","n":8,"short":"Degraded ops and failover","title":"Degraded operations and failover","refs":["SOP-GSOC-013","SOP-GSOC-014"],"lede":"Equipment fails, and sometimes the building does. Degraded operations are declared and managed, never quietly absorbed. You make the declaration, and you’re the one who tells the client plainly what isn’t being watched.","blocks":[{"h":"Find the scope first"},{"p":"Log the fault the moment it’s found: site, component, symptom, time, and impact. Then establish scope. One camera, one site, or systemic? A systemic fault often looks like a single-site fault at first, so check a second site before you decide. Only documented first-line fixes get tried. Nobody improvises on production systems."},{"act":{"id":"u8s","type":"sort","title":"How bad is it?","intro":"Classify each fault using the impact table in SOP-GSOC-013.","bins":[{"id":"mi","label":"Minor"},{"id":"si","label":"Significant"},{"id":"cr","label":"Critical"}],"items":[{"t":"One camera down at a low-criticality site","b":"mi","w":"Single camera, site still substantially monitored. Log it, ticket it, note it in passdown."},{"t":"PTZ control lost on one camera at a medium site","b":"mi","w":"A non-critical capability on one camera."},{"t":"A full site has gone dark","b":"si","w":"Level 2, declare degraded operations, notify the client."},{"t":"Talk-down lost across five sites","b":"si","w":"A capability lost across multiple sites is Significant."},{"t":"The incident system is unavailable","b":"cr","w":"Critical by definition. Level 4 and a degraded-operations declaration."},{"t":"The primary dispatch channel is down","b":"cr","w":"Critical by definition."},{"t":"Two high-criticality sites are dark","b":"cr","w":"Multiple high-criticality sites lost is Critical."}]}},{"h":"Declaring it"},{"p":"You declare degraded operations and record the time, the scope, and which capabilities are affected. You brief every operator on what’s lost and which compensating measures are in force. You notify the client under SOP-GSOC-012 and say plainly what isn’t being monitored. The SOP calls understating the impact the single worst option available. Compensating measures get recorded, and a running log is kept for the whole period."},{"ctrl":"The Client is told what is not being monitored, as soon as it is known. A client operating on a false belief about their coverage is exposed to a risk they have not accepted and cannot manage.","src":"SOP-GSOC-013"},{"act":{"id":"u8m","type":"sort","title":"Match the compensating measure","intro":"Each loss has its own compensating measure. Match them.","bins":[{"id":"cam","label":"Camera or partial view lost"},{"id":"site","label":"Full site view lost"},{"id":"inc","label":"Incident system down"},{"id":"disp","label":"Primary dispatch channel down"},{"id":"ws","label":"Workstation failed"}],"items":[{"t":"Sweep the remaining views more often, and name the blind area in the record and passdown","b":"cam","w":"The gap is narrow, so you work the views you still have and make the blind spot explicit."},{"t":"Tell the client, ask for more physical patrol, and log when the gap started and ended","b":"site","w":"With no view at all, coverage has to come from people on site."},{"t":"Switch to the manual log, timestamp each entry at the action, back-load later marked reconstructed","b":"inc","w":"Original times preserved, reconstruction marked (SOP-GSOC-013, SOP-GSOC-008)."},{"t":"Move to the documented fallback, confirm it works before relying on it, and tell the officers","b":"disp","w":"An untested fallback is a guess."},{"t":"Move the operator to a spare console, and never put two operators on one console","b":"ws","w":"Sharing a console breaks one-operator-one-console accountability."}]}},{"h":"Standing down"},{"p":"Verify full function before you stand down. A partially restored feed is still a degraded state. Then you formally stand down and record the time, the manual log gets reconciled into the system of record, and the client hears that full service is back along with the total duration. Any Significant or Critical event gets a root-cause review that feeds the Platform SME and the SOP Lead."},{"h":"Failover"},{"p":"You or the Program Director declare failover and record the time and reason. Confirm the failover floor has capacity and certified staff for this program, notify the client at Level 4 with the expected duration, and tell officers about any change to the dispatch channel. [CONFIRM] failover arrangement and test cadence per program."},{"p":"Transfer happens site by site, with a named operator on the failover floor accepting each site and the moment recorded, using the same handover standard as any shift change. Every open incident goes across with its full status. The failover floor confirms it can reach the incident system, the matrix, and every required feed before the primary floor stands down. In failover, every procedure applies unchanged. Coming back, verify that every system on the primary floor works, not just the one that failed, transfer back the same way, and run a post-event review."},{"ctrl":"The primary floor does not stand down until the failover floor has confirmed acceptance, site by site. A monitoring gap during transfer is the failure mode this entire procedure exists to prevent.","src":"SOP-GSOC-014","note":"SOP-GSOC-014 assumes there’s time to finish the transfer. If the building has to be evacuated first, the life-safety control in Part A governs: people leave. The untransferred sites go to the failover floor immediately as a declared, timed gap, and the client is told. The simulator walks through this. It’s a gap in the SOP worth raising with the SOP Lead."},{"act":{"id":"u8k","type":"check","title":"Check yourself","qs":[{"q":"Feeds come back at 13 of 15 sites. Can you stand down?","o":[{"t":"Yes. Most of the floor is back.","w":"A partially restored state is still degraded (SOP-GSOC-013)."},{"t":"No. Verify full function first.","w":"Stand-down follows full verification, not majority recovery."},{"t":"Yes, as long as the two sites are in the passdown.","w":"Writing it down doesn’t make it restored."},{"t":"Only if the client agrees.","w":"Stand-down is a verification question, not a client one."}],"a":1,"r":"SOP-GSOC-013"},{"q":"One site goes dark. Before you call it a single-site fault, what do you check?","o":[{"t":"The site’s power supplier.","w":"Maybe later. Scope first."},{"t":"A second site.","w":"A systemic fault often presents as a single-site one at first (SOP-GSOC-013)."},{"t":"The client’s internal IT ticket queue.","w":"Not yours to check, and not the question."},{"t":"Nothing. Raise a ticket.","w":"A ticket without scope can miss a floor-wide failure."}],"a":1,"r":"SOP-GSOC-013"},{"q":"During failover, an Atlanta operator says, “We’re on the backup floor, so we’ll skip read-backs on dispatches tonight.”","o":[{"t":"Reasonable, given the pressure.","w":"Pressure is when discipline matters most."},{"t":"No. Every procedure applies unchanged in failover.","w":"Failover changes location, not standard (SOP-GSOC-014)."},{"t":"Only for low-criticality sites.","w":"There’s no criticality exemption."},{"t":"Fine, if it’s in the passdown.","w":"Recording a deviation doesn’t authorize it."}],"a":1,"r":"SOP-GSOC-014"}]}}]},{"id":"u9","n":9,"short":"Assurance and records","title":"Assurance: QA, KPIs, certification and records","refs":["SOP-GSOC-015","SOP-GSOC-016","SOP-GSOC-002","SOP-GSOC-017","SOP-GSOC-018"],"lede":"Assurance is how the program proves it delivered. Under the KD-1 decisions the Supervisor carries the QA function, which means you’ll audit other shifts while someone else audits yours.","blocks":[{"h":"QA"},{"p":"QA has to be functionally independent of the floor it audits, so a Supervisor never audits their own shift. A random sample of incidents is drawn each period across every operator, every shift, and every day of the week. Weekend and overnight shifts are named specifically because most operations under-audit them. A sample from sites with a high false-alert history is pulled on purpose, to test for complacency. [CONFIRM] sampling rate."},{"p":"Some things aren’t sampled at all. They’re reviewed every time."},{"act":{"id":"u9s","type":"sort","title":"Sample it or review it all?","intro":"Which of these get 100 percent review, and which go into the random sample?","bins":[{"id":"all","label":"Review 100 percent"},{"id":"smp","label":"Sample"}],"items":[{"t":"Every Level 5 event","b":"all","w":"Reviewed in full (SOP-GSOC-015)."},{"t":"Every Level 6 event","b":"all","w":"Reviewed in full."},{"t":"Every dispatch on what turned out to be a false alert","b":"all","w":"Reviewed in full."},{"t":"Every failed dispatch","b":"all","w":"Reviewed in full."},{"t":"Every degraded-operations period","b":"all","w":"Reviewed in full."},{"t":"A routine Level 3 dispatch with a clean outcome","b":"smp","w":"Random sample."},{"t":"A Level 1 false alert closed with a specific cause","b":"smp","w":"Random sample."},{"t":"Records from a site with a high false-alert history","b":"smp","w":"Sampled deliberately, to test for verification complacency."}]}},{"p":"Findings are graded as an observation, a minor non-conformance, a major non-conformance, or a critical control failure. Critical control failures go to the SOP Lead and Program Director within one shift and aren’t held for the periodic report. Every finding has a named owner, an agreed corrective action, and a due date, and a finding without an owner isn’t a finding. Closure is verified by sampling the same criterion again, not by taking someone’s word that it’s fixed."},{"ctrl":"QA findings that recur across multiple operators are treated as a defect in this manual or in training, not as a discipline matter. Blaming individuals for a systemic defect guarantees the defect persists.","src":"SOP-GSOC-015"},{"h":"KPIs"},{"p":"A KPI can’t be reported until it has a start event, an end event, exclusions, and a target with its measurement period. Values come from system timestamps wherever possible, and any manual entry is flagged. A value that can’t be reconciled to its record is left out of the reported figure and listed as an exception. Captured values are never adjusted. Where an exclusion applies, the raw and adjusted figures go side by side with the exclusion stated. When a target’s missed, the cause and the corrective action go in the same report, without waiting to be asked."},{"ctrl":"KPI figures are reported as measured, including when they miss target. A report that only ever shows green is not believed by anyone and destroys the credibility of the ones that matter.","src":"SOP-GSOC-016"},{"act":{"id":"u9d","type":"decide","title":"The monthly report","intro":"You’re putting together the client report. Four decisions.","cards":[{"s":"Acknowledgement time missed target this month, mostly because of a 40-minute platform outage. The annex lists planned maintenance as an exclusion, and says nothing about outages.","o":[{"t":"Report the figure without the outage alerts","w":"Captured values are never adjusted, and an exclusion only applies when the definition lists it (SOP-GSOC-016)."},{"t":"Report it as measured, with the cause and corrective action in the same report","ok":true,"w":"That’s the standard for a missed target."}]},{"s":"Three alerts’ acknowledgement times can’t be reconciled to their records.","o":[{"t":"Leave them out of the reported figure and list them as exceptions","ok":true,"w":"Neither silently included nor silently dropped (SOP-GSOC-016)."},{"t":"Include them as captured","w":"A value that doesn’t reconcile isn’t a measurement."},{"t":"Drop them quietly","w":"Silent exclusion is the other way to get this wrong."}]},{"s":"A director asks you to keep this month’s client report “green.”","o":[{"t":"Report as measured, misses included","ok":true,"w":"An all-green report isn’t believed by anyone (SOP-GSOC-016)."},{"t":"Leave out the KPIs that missed","w":"That’s a selectively green report. Same problem."}]},{"s":"Mid-quarter, the client says acknowledgement time should start at their sensor trigger, not when the alert reaches the console.","o":[{"t":"Change the calculation for this quarter","w":"Definitions are settled at annex approval, not at quarter end. Change one mid-period and the two sides stop measuring the same thing (SOP-GSOC-016)."},{"t":"Keep measuring to the annex definition and send the request to the Program Director as an annex change","ok":true,"w":"The annex binds the definition, and the Program Director approves the annex."}]}]}},{"h":"Certification"},{"p":"When Learning and Development recommends an operator, you approve the certification, and it’s recorded with date, scope, and expiry. Certification is per platform and per program, so an operator certified on one program isn’t certified on another until the difference has been trained and assessed. Decertification is immediate for a critical control deviation, record falsification, or a failed reassessment, and it takes away console authorization the same shift. Getting back in needs Program Director approval and a documented remediation plan."},{"ctrl":"No operator is assessed against a procedure they have not been trained on. Where a manual revision changes a procedure, training precedes enforcement.","src":"SOP-GSOC-017","note":"You’ll also coordinate the unannounced live-floor scenario exercises with Learning and Development. They exist to test real response, not rehearsed response."},{"h":"Records and evidence"},{"p":"Each record class lives in its designated system. A record held only on a workstation, a personal drive, or in email doesn’t exist as far as the manual is concerned, and it’s a data-protection exposure. Access is granted by role on least privilege and revoked the same day someone changes role. Every touch of evidence is logged. Outside requests for records go through the Program Director, including police requests outside a live emergency. Before anything is disposed of, confirm right then that no hold applies. Keeping records past their period isn’t a safe choice. It’s an exposure."},{"ctrl":"Every touch of evidence is logged. Unlogged access is indistinguishable from tampering once it is challenged, and the person who accessed it will not be believed simply because they were acting properly.","src":"SOP-GSOC-018"},{"act":{"id":"u9c","type":"decide","title":"People and evidence","intro":"Five calls about certification and records.","cards":[{"s":"An operator certified on Program A is free tonight, and Program B is short.","o":[{"t":"Put him on B for one shift","w":"Certification is per platform and per program (SOP-GSOC-002)."},{"t":"Not until the difference between the programs is trained and assessed","ok":true,"w":"The delta is trained and assessed before console assignment."}]},{"s":"An operator on your shift moved to the back-office team today.","o":[{"t":"Revoke his GSOC access today","ok":true,"w":"Access is revoked on role change the same day (SOP-GSOC-018)."},{"t":"Leave it until the next periodic access review","w":"Periodic reviews catch drift. Role changes are same-day."}]},{"s":"Last quarter’s evidence reaches the end of its retention period tonight. A claim letter about one of those incidents arrived yesterday.","o":[{"t":"Dispose on schedule","w":"A hold suspends routine deletion regardless of the schedule."},{"t":"Make sure the hold is on for the affected records, and confirm no hold applies immediately before any disposal","ok":true,"w":"Any indication of a claim triggers a hold, and the no-hold check happens right before disposal, not when the schedule was set (SOP-GSOC-018)."},{"t":"Wait for the attorney’s formal notice","w":"Don’t wait for formal notice (SOP-GSOC-018)."}]},{"s":"A detective calls the morning after a burglary and asks you to email him the footage.","o":[{"t":"Send it. He’s police","w":"Supervisors don’t release records directly, including to police outside a live emergency (SOP-GSOC-018)."},{"t":"Route it to the Program Director, who verifies identity and authority and records the disclosure","ok":true,"w":"Every external records request goes through the Program Director."}]},{"s":"QA finds a clip was viewed twice with no access log entry. The viewer says it was only to check a timestamp.","o":[{"t":"Fine, the reason’s legitimate","w":"Unlogged access can’t be told apart from tampering once it’s challenged (SOP-GSOC-018)."},{"t":"Record it as a QA finding with an owner and a due date, and document the chain-of-custody gap honestly","ok":true,"w":"The break in the chain is now a fact. Documenting it is what keeps the rest of the evidence credible."}]}]}},{"act":{"id":"u9k","type":"check","title":"Check yourself","qs":[{"q":"Under KD-1 you carry the QA function. Whose records can you sample?","o":[{"t":"Any records, including your own shift’s.","w":"QA has to be independent of the floor it audits."},{"t":"Other shifts’ records, never your own shift’s.","w":"A supervisor doesn’t audit their own shift (SOP-GSOC-015)."},{"t":"Only Level 5 and 6 records.","w":"Those are reviewed in full, but the sample covers everything."},{"t":"Only records the Program Director assigns.","w":"Sampling is random against a defined methodology."}],"a":1,"r":"SOP-GSOC-015"},{"q":"A finding goes into the register with no owner. Where does that leave it?","o":[{"t":"Open until someone picks it up.","w":"Nobody will."},{"t":"It isn’t a finding yet. It needs a named owner, a corrective action, and a due date.","w":"A finding with no owner is not a finding (SOP-GSOC-015)."},{"t":"It defaults to the SOP Lead.","w":"There’s no default owner."},{"t":"It closes at the next periodic report.","w":"Closure is verified by re-sampling, not by the calendar."}],"a":1,"r":"SOP-GSOC-015"},{"q":"A revision changes the dispatch brief. QA flags an operator who used the old brief two days before the floor was trained on the new one.","o":[{"t":"Major non-conformance against the operator.","w":"The operator hadn’t been trained on it."},{"t":"They aren’t assessed against a procedure they weren’t trained on. Training comes before enforcement.","w":"That’s the SOP-GSOC-017 control."},{"t":"Decertify until retrained.","w":"There’s no competency failure here."},{"t":"Coaching note in the file.","w":"There’s nothing to coach. The gap is in rollout timing."}],"a":1,"r":"SOP-GSOC-017"}]}}]}],"sims":[{"id":"s1","title":"Two calls at 02:10","tags":["Level 5","parallel notification","officer welfare","Level 6"],"when":"Tuesday, 02:10. Plano floor, three operators on console.","brief":"You’re the GSOC Supervisor on nights. Dee Okafor has site S-4417 on her wall. Marcus Hale has the distribution centers. Priya Raman dispatched the on-site officer at S-2214 at 01:50 for a person walking the closed yard.","start":"n1","nodes":{"n1":{"t":"Dee, on the floor channel: “S-4417, rear lot. One person on the ground, not moving. Someone’s standing over them. I’m calling it in.” At the same moment Marcus says he’s got four alerts across three sites in the last ninety seconds.","c":[{"t":"Walk over to Dee’s console and confirm what she’s seeing before she calls","to":"x_delay"},{"t":"“Go.” Let Dee make the call, and take the S-4417 client notification yourself","to":"n2"},{"t":"Tell Dee to send the S-4417 officer in first and call once he has eyes on it","to":"x_sole"}]},"n2":{"t":"Dee’s on the line with the emergency dispatch number from the site annex. You reach the S-4417 client escalation contact and tell them what’s known and what isn’t. Marcus is working his surge. Then Priya turns around: “The S-2214 officer’s past his report-back. I called once. No answer.”","c":[{"t":"Have Priya try again now, and if he doesn’t answer, treat it as officer welfare at Level 5","to":"n3"},{"t":"He’s probably dealing with the subject. Have Priya check again once the surge clears","to":"x_welfare"},{"t":"Have Priya email the guard company’s supervisor so it’s in writing","to":"x_email"}]},"n3":{"t":"Priya tries again. Nothing. She calls emergency services for S-2214 on that site’s dispatch number. Marcus says three of his four alerts look like wind on the same fence line, and the fourth is a car idling with its lights off at a high-criticality DC. He asks if he can close the three together. On Dee’s screen, EMS is pulling in. The person on the ground still isn’t moving.","c":[{"t":"Call the Program Director now, since a possible serious injury is a Level 6 trigger. Tell Marcus each alert still gets its own look, car first","to":"n4"},{"t":"Hold the Level 6 call until EMS confirms how bad it is","to":"x_late6"},{"t":"Tell Marcus yes, close the three wind alerts as one entry so he can focus on the car","to":"x_bulk"}]},"n4":{"t":"The Program Director has it. At 02:31 Priya’s officer calls in: his radio battery died and he walked back to his car to phone. He’s fine. Police are already on the way to S-2214. Marcus has verified each alert separately and is briefing the DC officer about the car. What’s left for you before the shift ends?","c":[{"t":"Priya tells the dispatcher the officer’s safe. Then every record gets completed with full timestamps, agency incident numbers go in, legal holds go on at both sites, and both Level 5 events are flagged for full QA review","to":"x_best"},{"t":"Priya tells the dispatcher the officer’s safe and closes S-2214 as a false alarm","to":"x_cancel"}]},"x_delay":{"end":"fail","title":"You put yourself between the operator and the call","t":"Level 5 is actioned by the operator, immediately. Dee was right to call without asking, and walking over to confirm made her wait for you. Life safety outranks chain of command, and that includes the Supervisor. The better move was one word, “Go,” and then the parallel leg.","refs":["SOP-GSOC-000 A4","A6","SOP-GSOC-011"]},"x_sole":{"end":"fail","title":"You sent the officer in alone","t":"An officer is never dispatched into a verified life-safety situation as the sole response. Emergency services are engaged in parallel, not after the officer reports back. Here the officer would be walking toward someone standing over an injured person, with no one else on the way.","refs":["SOP-GSOC-010","SOP-GSOC-011"]},"x_welfare":{"end":"poor","title":"The officer’s silence went unanswered","t":"When an officer misses the report-back and doesn’t answer, officer welfare is treated as a potential life-safety matter and goes to Level 5. “Probably busy” is an assumption. The surge doesn’t outrank a person you’ve sent toward a problem and now can’t reach.","refs":["SOP-GSOC-010"]},"x_email":{"end":"fail","title":"Something urgent went into an inbox","t":"Email is never used for an urgent or life-safety matter. Time-critical things are spoken. An officer who won’t answer needs another call attempt and then Level 5, not a message someone might read at 07:00.","refs":["SOP-GSOC-012","SOP-GSOC-010"]},"x_late6":{"end":"rec","title":"Level 6 went out late","t":"Serious injury is a Level 6 trigger, and someone unmoving on the ground with another person standing over them is a plausible one. Waiting for EMS to confirm leaves the Program Director behind events. It’s recoverable, and that’s the point of escalating early: getting it wrong in that direction costs one phone call.","refs":["SOP-GSOC-000 A6","SOP-GSOC-007"]},"x_bulk":{"end":"poor","title":"Three alerts closed on a guess","t":"Each alert gets its own verification and its own specific cause. Closing three together because they look like the same wind is the complacency QA samples for, and one of them might not be wind. Taking the car first was right. The other three still get looked at.","refs":["SOP-GSOC-001","SOP-GSOC-007","SOP-GSOC-015"]},"x_cancel":{"end":"rec","title":"Right update, wrong label","t":"Telling the dispatcher the officer’s safe is right, since responders get live updates on changing conditions. But the Level 5 wasn’t a false alarm. It was the correct escalation on what was known at the time, and “false alarm” isn’t a cause anyway. Record what happened, in order, with times.","refs":["SOP-GSOC-011","SOP-GSOC-008"]},"x_best":{"end":"best","title":"The floor held, and so did the record","t":"Dee called without waiting. You took the client leg in parallel. Priya treated a silent officer as a welfare risk, and the Program Director heard about a possible serious injury before anyone had to ask. A police response is presumptive grounds for a hold, and every Level 5 and Level 6 event gets full QA review, so the records you close tonight will be read again.","refs":["SOP-GSOC-011","SOP-GSOC-015","SOP-GSOC-018"]}}},{"id":"s2","title":"The system of record goes dark","tags":["degraded operations","impact classification","client notification"],"when":"Thursday, 03:40. Plano floor, four operators.","brief":"One live Level 3 at S-3307: an officer’s on scene with a trespasser. Everything else is quiet. The program’s incident system is AURIX.","start":"n1","nodes":{"n1":{"t":"Jordan: “AURIX just froze on me.” A minute later Kai says his won’t load either. Jordan asks, “Should I write on paper and put it in later?”","c":[{"t":"Check a third console to confirm it’s systemic, then declare","to":"n2"},{"t":"“Sure, paper’s fine, we’ll back-fill at end of shift.” Keep working","to":"x_absorb"},{"t":"Call the Platform SME and hold off on declaring anything until they’ve diagnosed it","to":"x_wait"}]},"n2":{"t":"It’s down for everyone. Cameras and the dispatch line still work. How do you classify the impact?","c":[{"t":"Minor. The cameras are fine","to":"x_minor"},{"t":"Significant. Level 2, declare degraded operations","to":"x_sig"},{"t":"Critical. Level 4, declare degraded operations","to":"n3"}]},"n3":{"t":"You declare at 03:44 and record the time, the scope, and what’s affected. You brief all four operators: manual log in force, every entry timestamped at the moment of the action. Now the client. What do you tell them?","c":[{"t":"“We’re having a minor technical issue. Monitoring isn’t affected.”","to":"x_understate"},{"t":"“Our incident logging system has been down since 03:40. Cameras and dispatch are working and we’re on a manual log. Next update by 04:30.”","to":"n4"},{"t":"Wait until it’s fixed, then send one update with the total duration","to":"x_latenote"}]},"n4":{"t":"04:55. AURIX is back for three operators. Kai still can’t log in. Jordan asks if he can start typing his paper notes in.","c":[{"t":"Stand down degraded operations. Most of the floor is back","to":"x_partial"},{"t":"Keep the declaration in force until it works for everyone. Then stand down formally, back-load the manual log marked reconstructed with original times, tell the client the total duration, and open a root-cause review","to":"x_best"}]},"x_absorb":{"end":"fail","title":"The floor absorbed it quietly","t":"Degraded operations are declared and managed, never quietly absorbed. Without a declaration there’s no recorded start time, the client doesn’t know, and end-of-shift back-filling turns every timestamp into a guess. The SOP version is a documented manual log, timed at the action, back-loaded later and marked reconstructed.","refs":["SOP-GSOC-013","SOP-GSOC-008"]},"x_wait":{"end":"poor","title":"You waited for a diagnosis","t":"Wanting to know the scope is right, but the declaration is yours and doesn’t need the SME’s diagnosis. While you wait, nothing is being recorded properly and the clock on telling the client keeps running. Declare, then let the SME work.","refs":["SOP-GSOC-013"]},"x_minor":{"end":"poor","title":"Wrong column","t":"Losing the incident system is Critical by definition, whatever the cameras are doing. That means Level 4 and a degraded-operations declaration.","refs":["SOP-GSOC-013"]},"x_sig":{"end":"rec","title":"Right instinct, one level light","t":"You declared, which matters most. But incident system loss is Critical rather than Significant, so the escalation is Level 4, not Level 2. That changes who hears about it and how fast.","refs":["SOP-GSOC-013"]},"x_understate":{"end":"fail","title":"You understated the impact","t":"The client is told what isn’t working, as soon as it’s known. The SOP calls understating the impact the single worst option available, because the client is now carrying a risk they don’t know about and can’t manage.","refs":["SOP-GSOC-013","SOP-GSOC-012"]},"x_latenote":{"end":"fail","title":"The client found out afterward","t":"Notification happens as soon as the gap is known, not once it’s fixed. A client working from a false belief about their coverage is exposed to a risk they never accepted.","refs":["SOP-GSOC-013"]},"x_partial":{"end":"poor","title":"You stood down too early","t":"A partially restored system is still a degraded state. Verify full function before standing down. Kai is still on paper, and the record for that hour depends on it.","refs":["SOP-GSOC-013"]},"x_best":{"end":"best","title":"Declared, told, restored, reconciled","t":"You found the scope, classified it Critical, declared with a time, and told the client plainly what was down. You waited for full function, stood down formally, and the manual entries went in marked reconstructed with their original times. Every degraded-operations period gets full QA review, and the root-cause review goes to the Platform SME and the SOP Lead.","refs":["SOP-GSOC-013","SOP-GSOC-015"]}}},{"id":"s3","title":"The phones after the incident","tags":["media","unverified callers","disclosure","legal hold"],"when":"Saturday, 09:15. Plano floor, day shift.","brief":"Overnight, police responded to a fight in the S-5521 parking lot and one person was taken to hospital. The overnight Supervisor flagged it in passdown and the records are still open.","start":"n1","nodes":{"n1":{"t":"An operator hands you a call. “She says she’s from Channel 8.” The reporter asks whether the GSOC’s cameras caught the fight and whether anyone’s been arrested.","c":[{"t":"“I can’t comment on an active investigation.”","to":"x_confirm"},{"t":"“I’m not able to help with that. Can I take your name and number for the right person?” Then route it to the Program Director and log the call","to":"n2"},{"t":"Transfer her to the client’s escalation contact","to":"x_transfer"}]},"n2":{"t":"Ten minutes later a man calls saying he’s the client’s new district manager. He isn’t on the authorized contact list. He wants the footage emailed to him within the hour.","c":[{"t":"Email it. He obviously works for the client","to":"x_email"},{"t":"Verify him with an authorized contact. Even if he checks out, a footage release goes through the Program Director","to":"n3"},{"t":"Tell him the footage has already been overwritten","to":"x_lie"}]},"n3":{"t":"At 10:05 an email arrives from a law firm representing the injured person, asking the GSOC to “preserve all video and records.”","c":[{"t":"Make sure the legal hold is in place now and tell the Program Director, who records it in the hold register","to":"x_best"},{"t":"Wait for a formal subpoena before holding anything","to":"x_wait"},{"t":"Reply to the attorney with a copy of the incident record so they have what they need","to":"x_release"}]},"x_confirm":{"end":"poor","title":"“No comment” said yes","t":"Mentioning an active investigation confirms that something happened. Media enquiries go to the Program Director without confirming any detail, including whether an incident occurred. Take the details, route them, and record the call.","refs":["SOP-GSOC-012"]},"x_transfer":{"end":"poor","title":"Routed to the wrong place","t":"Enquiries from media, insurers, attorneys, and the public go to the Program Director without exception. Passing a reporter to the client’s escalation line hands your client a problem the GSOC was supposed to contain.","refs":["SOP-GSOC-012"]},"x_email":{"end":"fail","title":"Unverified caller, unapproved release","t":"Client staff who aren’t on the authorized list get verified with an authorized contact before anything is shared. And a footage release is a disclosure, so it goes through the Program Director, who checks authority and records it.","refs":["SOP-GSOC-012","SOP-GSOC-018"]},"x_lie":{"end":"fail","title":"You made something up","t":"Apart from being untrue, it puts a false statement into a matter that’s heading toward litigation. Verify the caller, then route the request to the Program Director.","refs":["SOP-GSOC-012","SOP-GSOC-018"]},"x_wait":{"end":"fail","title":"You waited for paper","t":"A hold goes on at any indication of litigation, a claim, or a law-enforcement request. Nobody waits for formal notice. Last night’s police response was already presumptive grounds for a hold.","refs":["SOP-GSOC-018","SOP-GSOC-011"]},"x_release":{"end":"fail","title":"You released records to the other side","t":"Every external request for records goes through the Program Director, who verifies identity and legal authority and records the disclosure. Supervisors don’t release records directly.","refs":["SOP-GSOC-018"]},"x_best":{"end":"best","title":"Nothing confirmed, nothing released, everything kept","t":"The reporter got nothing, not even confirmation. The caller was checked and the release went to the Program Director. The hold is in place and deletion is suspended for the affected records. Every one of those enquiries, the refused ones too, is logged with caller details and how it was routed.","refs":["SOP-GSOC-012","SOP-GSOC-018"]}}},{"id":"s4","title":"Evacuate the floor","tags":["failover","site-by-site transfer","life safety on your own floor"],"when":"Wednesday, 14:20. Plano floor, day shift. 22 sites live, 2 open incidents.","brief":"The building fire alarm goes off. Facilities says the building is evacuating and you have about five minutes. Atlanta is the designated failover floor for this program.","start":"n1","nodes":{"n1":{"t":"Every operator is looking at you. What’s first?","c":[{"t":"Everyone log off and head out. Atlanta can pick it up","to":"x_gap"},{"t":"Declare failover, record the time and reason, and call Atlanta to confirm capacity and certified staff","to":"n2"}]},"n2":{"t":"Atlanta confirms two operators certified on this program. You notify the client at Level 4 with an expected duration and tell the officers the dispatch channel isn’t changing. How do you hand over?","c":[{"t":"Read Atlanta the site list in one call and stand down","to":"x_list"},{"t":"Open incidents first with full status, then site by site with a named Atlanta operator accepting each and the time recorded. Confirm they can see the feeds, the matrix, and AURIX","to":"n3"}]},"n3":{"t":"14:24. Smoke in the corridor. Facilities says get out now. Eight sites are transferred and accepted. Fourteen aren’t.","c":[{"t":"Stay at the consoles until all 22 are accepted. The control says the primary doesn’t stand down early","to":"x_stay"},{"t":"Evacuate now. On the way out, tell Atlanta which fourteen sites aren’t accepted and to take them immediately, and note when the gap started","to":"n4"},{"t":"Evacuate, and sort out the remaining sites tomorrow","to":"x_tomorrow"}]},"n4":{"t":"Outside, you reach Atlanta by phone. They’ve taken all fourteen by 14:31. The client and the Program Director need to hear about the gap.","c":[{"t":"Tell the client plainly that fourteen sites had no accepting floor from 14:24 to 14:31. Record it, manage it as degraded operations, and plan the return to primary","to":"x_best"},{"t":"Leave the gap out. Seven minutes isn’t worth alarming anyone over","to":"x_hide"}]},"x_gap":{"end":"fail","title":"Everyone left, and nobody took over","t":"The primary floor doesn’t stand down until the failover floor has confirmed acceptance, site by site. Logging off while there’s still time to transfer creates exactly the monitoring gap the procedure exists to prevent.","refs":["SOP-GSOC-014"]},"x_list":{"end":"poor","title":"Handover by list","t":"Urgency is exactly when handover discipline gets dropped, and exactly when dropping it costs most. Site by site, with named acceptance and the time, to the same standard as a shift change, and every open incident with its full status.","refs":["SOP-GSOC-014","SOP-GSOC-009"]},"x_stay":{"end":"fail","title":"You kept people in a building with smoke in it","t":"Life safety outranks every other consideration in the manual, including scope, client preference, and continuity, and that covers your own floor. SOP-GSOC-014 assumes there’s time to finish the transfer. When there isn’t, people leave, and the untransferred sites become a declared, timed gap that the failover floor takes immediately. The SOP doesn’t spell this case out, so the module applies the Part A control. Raise it with the SOP Lead as a gap.","refs":["SOP-GSOC-000 A4","SOP-GSOC-014"]},"x_tomorrow":{"end":"fail","title":"The gap was left open","t":"Leaving was right. Leaving fourteen sites without a floor until tomorrow isn’t. Atlanta takes them immediately, the start and end of the gap get recorded, and the client is told.","refs":["SOP-GSOC-014","SOP-GSOC-013"]},"x_hide":{"end":"fail","title":"The gap went unreported","t":"The client is told what isn’t being monitored, as soon as it’s known. Seven minutes with no accepting floor across fourteen sites is exactly what a client needs to hear about, and reporting it honestly is what keeps your other reports believable.","refs":["SOP-GSOC-013","SOP-GSOC-016"]},"x_best":{"end":"best","title":"People out, coverage back, gap on the record","t":"You declared, confirmed capacity, told the client and officers, and transferred site by site. When the building forced the issue, people came first, and the remaining sites went straight to Atlanta, timed and reported. Coming back, you’ll verify every system on the primary floor, not just the one that tripped, transfer back site by site, and run a post-event review.","refs":["SOP-GSOC-014","SOP-GSOC-000 A4","SOP-GSOC-013"]}}},{"id":"s5","title":"Closing time","tags":["closure review","late entries","falsification"],"when":"Monday, 06:40. Plano floor, end of overnight.","brief":"Eleven records are waiting for closure review. The day Supervisor arrives at 07:00. It’s been a long night.","start":"n1","nodes":{"n1":{"t":"Jordan Pike: “You’re slammed. Want me to just close mine? They’re clean.”","c":[{"t":"“Just this once, go ahead.”","to":"x_self"},{"t":"“Thanks, but no. I’ll review them.”","to":"n2"}]},"n2":{"t":"On INC-30452 there’s an entry for an 02:14 call attempt. Its entry time shows 06:20, with no note. Jordan says he forgot to log it during the call.","c":[{"t":"Approve it. The call did happen","to":"x_approve"},{"t":"Return it. The late entry needs a note giving the reason, the deviation gets recorded, and you review it before closing","to":"n3"},{"t":"Ask Jordan to change the entry time to 02:14 so the record reads correctly","to":"x_backdate"}]},"n3":{"t":"Next, INC-30455. The audit trail shows an entry time edited from 05:58 to 03:31, so a late entry now reads as live. Jordan made the edit.","c":[{"t":"Coach him. It’s the same habit as the last one","to":"x_coach"},{"t":"Remove him from the floor now, report it to the SOP Lead and Program Director within the shift, start decertification, and leave the record exactly as it is","to":"n4"},{"t":"Quietly change it back yourself and move on","to":"x_fix"}]},"n4":{"t":"06:58. Nine records are still unreviewed and the day Supervisor is walking in.","c":[{"t":"Hand the nine over in the passdown as open items with their status, for the day Supervisor to review","to":"x_best"},{"t":"Close the nine now so day shift starts clean","to":"x_bulkclose"}]},"x_self":{"end":"fail","title":"Self-closure","t":"An operator doesn’t close their own incident, and review is never waived for a busy shift. Clean records go through you too.","refs":["SOP-GSOC-008"]},"x_approve":{"end":"poor","title":"A late entry went through unexplained","t":"The call is materially relevant, so it belongs in the record. But a late entry needs its reason recorded by the person who deviated, and you review that deviation before closure. Approving it silently teaches the floor that timing doesn’t matter.","refs":["SOP-GSOC-000 A8","SOP-GSOC-008"]},"x_backdate":{"end":"fail","title":"You asked for a backdated entry","t":"Changing an entry time so a late entry looks contemporaneous is backdating, and backdating is falsification. You’d have directed it. That’s grounds for immediate removal from the floor.","refs":["SOP-GSOC-000 A8"]},"x_coach":{"end":"fail","title":"Falsification treated as a habit","t":"A late entry with an honest timestamp is a deviation. Editing the timestamp to hide it is falsification, which means immediate removal and isn’t handled as a training matter.","refs":["SOP-GSOC-000 A8","SOP-GSOC-002"]},"x_fix":{"end":"fail","title":"You covered it","t":"Changing it back yourself hides what happened and adds your own edit to a record that’s now evidence of misconduct. Leave it exactly as it is and report it.","refs":["SOP-GSOC-000 A8","SOP-GSOC-018"]},"x_bulkclose":{"end":"poor","title":"Closed without review","t":"Closing nine records you haven’t read is closure without review. Unreviewed records go into the passdown as open items, with status, and the next Supervisor reviews them.","refs":["SOP-GSOC-008","SOP-GSOC-009"]},"x_best":{"end":"best","title":"The standard held to the last minute","t":"You kept closure where it belongs, told an honest late entry apart from a falsified one, removed the operator the same shift and reported it on time, and handed the remaining records over open instead of closing them unread.","refs":["SOP-GSOC-008","SOP-GSOC-000 A8","SOP-GSOC-002","SOP-GSOC-009"]}}},{"id":"s6","title":"The call that turned out fine","tags":["the asymmetry","client pushback","coaching"],"when":"Friday, 13:05. Plano floor, day shift.","brief":"At 12:20 Kai Brennan saw a person slumped and motionless in a parked car at S-1180, with the temperature at 98 degrees. He called emergency services. EMS found a contractor asleep with the engine and AC running.","start":"n1","nodes":{"n1":{"t":"The client’s loss prevention manager calls you, angry. “Your operator called EMS on a guy taking a lunch nap. That’s a vendor we’re now embarrassed in front of. I want that operator retrained.”","c":[{"t":"Apologize, agree it was an overreaction, and promise the retraining","to":"x_sorry"},{"t":"Acknowledge the frustration, explain plainly that a possible medical emergency gets escalated every time, and offer to add any regular contractor break pattern to the site profile","to":"n2"},{"t":"Tell him it’s on the client for not warning the GSOC about contractors","to":"x_blame"}]},"n2":{"t":"He grumbles, but accepts it. Now Kai. He heard part of the call and looks rattled.","c":[{"t":"“Next time, give it another couple of minutes before you call.”","to":"x_undercut"},{"t":"Tell Kai it was the right call, check that his record describes what he saw objectively, and pass the case to Learning and Development as an anonymized lesson","to":"x_best"},{"t":"Say nothing. He’ll get over it","to":"x_silent"}]},"x_sorry":{"end":"fail","title":"You agreed the call was wrong","t":"No operator is ever criticized for escalating an event that turned out less serious than it looked. Promising the client a retraining tells your floor that the rule bends when someone complains loudly enough.","refs":["SOP-GSOC-011"]},"x_blame":{"end":"poor","title":"Blame isn’t an answer","t":"Opinions about the client don’t belong in a client conversation. Explain the standard and offer the practical fix instead: documented legitimate activity lives in the site profile, where operators can use it during verification.","refs":["SOP-GSOC-012","SOP-GSOC-003"]},"x_undercut":{"end":"fail","title":"The asymmetry broke in one sentence","t":"Telling Kai to wait longer is criticism for escalating, and it teaches the whole floor to hesitate next time. The next one might not be a nap.","refs":["SOP-GSOC-011"]},"x_silent":{"end":"rec","title":"A missed moment","t":"Nothing harmful happened, but Kai’s left guessing whether the call hurt him. Operators believe the asymmetry when they hear you back it out loud.","refs":["SOP-GSOC-011","SOP-GSOC-017"]},"x_best":{"end":"best","title":"Backed the call, fixed the profile, passed the lesson on","t":"You held the standard with the client without arguing, offered the site-profile fix, told Kai he was right, and made sure his record is objective. SOP-GSOC-017 deliberately includes scenarios where escalation turns out unnecessary, and a real one teaches better than an invented one.","refs":["SOP-GSOC-011","SOP-GSOC-017","SOP-GSOC-003"]}}}],"exam":[{"id":"e01","q":"Two consoles have different versions of SOP-GSOC-010 open. Which one governs?","o":[{"t":"The controlled current version in the SOP Library.","w":"Printed or locally saved copies are uncontrolled and can’t be relied on, and two versions are never meant to be in force at once (A7)."},{"t":"Whichever one was printed most recently.","w":"Print date doesn’t make a copy controlled."},{"t":"The one saved to the console desktop, since it opens faster.","w":"A locally saved copy is uncontrolled."},{"t":"Either, as long as both are approved versions.","w":"A withdrawn version comes out of the live library the day its replacement is published."}],"a":0,"r":"SOP-GSOC-000 A7"},{"id":"e02","q":"Which of these is a Level 2 trigger?","o":[{"t":"A verified fire.","w":"That’s Level 5."},{"t":"Repeat activity at one site across the night.","w":"Repeat activity at one site is listed among the Level 2 triggers (A6)."},{"t":"Media at the gate.","w":"That’s Level 6."},{"t":"An event meeting the annex notification threshold.","w":"That’s Level 4."}],"a":1,"r":"SOP-GSOC-000 A6"},{"id":"e03","q":"During a Level 5, how does the client get notified?","o":[{"t":"By the operator, once the emergency call ends.","w":"Parallel, not sequential (SOP-GSOC-011)."},{"t":"In parallel with the emergency call, by a second operator or channel, often you.","w":"The Supervisor and client notifications run alongside the emergency call (SOP-GSOC-011)."},{"t":"By the Program Director.","w":"Level 6 is the Director’s. The client leg on a Level 5 runs from the floor."},{"t":"In the next scheduled client report.","w":"A life-safety event is never left for a report."}],"a":1,"r":"SOP-GSOC-011"},{"id":"e04","q":"What does your Level 4 client call have to cover?","o":[{"t":"What’s known, what isn’t known yet, what the GSOC has done, and what happens next.","w":"That’s the standard in SOP-GSOC-012."},{"t":"The likely cause and estimated loss.","w":"Never speculate on cause or loss value."},{"t":"Who’s at fault.","w":"Never speculate on liability."},{"t":"What the client should do next, legally.","w":"Never commit the client to a course of action."}],"a":0,"r":"SOP-GSOC-012"},{"id":"e05","q":"In an officer brief, what’s the difference between “no weapon observed” and “no weapon present”?","o":[{"t":"None. They mean the same thing.","w":"They don’t, and the officer’s safety depends on the difference."},{"t":"The first is what the operator can see. The second claims a fact nobody’s established. The officer has to know which one they’re getting.","w":"State explicitly what hasn’t been established (SOP-GSOC-010)."},{"t":"“No weapon present” is the more professional phrasing.","w":"It’s the less accurate one."},{"t":"The first is for police, the second for officers.","w":"Both audiences need the accurate version."}],"a":1,"r":"SOP-GSOC-010"},{"id":"e06","q":"At shift start a feed shows a perfect image of the yard. What confirms it’s actually live?","o":[{"t":"The image is sharp.","w":"A frozen feed can be perfectly sharp."},{"t":"Motion, or the timestamp moving forward.","w":"A frozen feed presents as a normal image, so confirm progression (SOP-GSOC-005)."},{"t":"The camera’s status light.","w":"Indicators aren’t checks."},{"t":"Nobody reported a problem last shift.","w":"Readiness is confirmed, never assumed from the previous shift."}],"a":1,"r":"SOP-GSOC-005"},{"id":"e07","q":"On a passdown, a repeating field left blank means what?","o":[{"t":"Nothing to report.","w":"It might. It might also mean not completed."},{"t":"Nothing usable. It’s ambiguous between nothing to report and not completed, which is why the template requires an explicit “none.”","w":"That ambiguity is exactly what fails at handover (Appendix D)."},{"t":"The outgoing operator ran out of time.","w":"Maybe. You can’t tell, and that’s the problem."},{"t":"The item was handled verbally.","w":"The written record supports the verbal one, it doesn’t get replaced by it."}],"a":1,"r":"Appendix D"},{"id":"e08","q":"During failover, when does accountability for a site move to the failover floor?","o":[{"t":"When failover is declared.","w":"Declaration starts the process. It doesn’t transfer anything."},{"t":"When a named operator on the failover floor accepts that site and the time is recorded.","w":"Site by site, with explicit named acceptance (SOP-GSOC-014)."},{"t":"When the primary floor logs off.","w":"That’s the gap the procedure prevents."},{"t":"When the client is notified.","w":"Client notification is separate from accountability transfer."}],"a":1,"r":"SOP-GSOC-014"},{"id":"e09","q":"When is the client told about a degradation that affects what’s being monitored?","o":[{"t":"Once it’s fixed, with the total duration.","w":"Too late. The client is told as soon as it’s known (SOP-GSOC-013)."},{"t":"As soon as it’s known, stating plainly what isn’t being monitored.","w":"That’s the control."},{"t":"In the monthly report.","w":"Far too late."},{"t":"Only if it lasts more than an hour.","w":"There’s no duration threshold."}],"a":1,"r":"SOP-GSOC-013"},{"id":"e10","q":"Which of these is Critical impact?","o":[{"t":"One camera down at a low-criticality site.","w":"Minor."},{"t":"A full site dark.","w":"Significant."},{"t":"The primary dispatch channel down.","w":"Critical by definition (SOP-GSOC-013)."},{"t":"Talk-down lost at two sites.","w":"Significant."}],"a":2,"r":"SOP-GSOC-013"},{"id":"e11","q":"Which of these does QA review 100 percent of, rather than sample?","o":[{"t":"Every Level 3 dispatch.","w":"Those are sampled."},{"t":"Every overnight record.","w":"Overnights are sampled deliberately, not reviewed in full."},{"t":"Every failed dispatch.","w":"Reviewed in full, along with Level 5 and 6 events, false-alert dispatches, and degraded periods (SOP-GSOC-015)."},{"t":"Every record from a repeat-false site.","w":"Those are sampled deliberately."}],"a":2,"r":"SOP-GSOC-015"},{"id":"e12","q":"QA finds a critical control failure on Tuesday. When is it reported?","o":[{"t":"In the monthly QA report.","w":"Critical failures aren’t held for the periodic report."},{"t":"To the SOP Lead and Program Director within one shift.","w":"That’s the rule (SOP-GSOC-015, A8)."},{"t":"At the next 90-day manual review.","w":"Far too late."},{"t":"Only if it caused harm.","w":"Harm isn’t the test. The control deviation is."}],"a":1,"r":"SOP-GSOC-015"},{"id":"e13","q":"How is a corrective action confirmed closed?","o":[{"t":"The owner emails to say it’s done.","w":"An assertion isn’t verification."},{"t":"By sampling the same criterion again.","w":"Closure is verified by re-sampling (SOP-GSOC-015)."},{"t":"Your sign-off.","w":"Sign-off without evidence is still an assertion."},{"t":"Thirty days pass without another finding.","w":"Absence of a finding isn’t evidence when nobody re-sampled."}],"a":1,"r":"SOP-GSOC-015"},{"id":"e14","q":"A KPI can be reported only when it has which four elements?","o":[{"t":"A start event, an end event, exclusions, and a target with its measurement period.","w":"Missing any one, and the parties aren’t measuring the same thing (SOP-GSOC-016)."},{"t":"An owner, a chart, a trend, and a comment.","w":"Presentation, not definition."},{"t":"A target, a stretch target, a floor, and a bonus.","w":"Not the definition standard."},{"t":"A system, a report, a recipient, and a cadence.","w":"Those are reporting logistics."}],"a":0,"r":"SOP-GSOC-016"},{"id":"e15","q":"An exclusion defined in the annex legitimately applies to part of this month’s dispatch-time data. How do you show it?","o":[{"t":"Report only the adjusted figure.","w":"The raw figure goes alongside it."},{"t":"Raw figure and adjusted figure side by side, with the exclusion stated.","w":"That’s the standard (SOP-GSOC-016)."},{"t":"Edit the captured values to remove the excluded time.","w":"Captured values are never adjusted."},{"t":"Leave the excluded alerts out without comment.","w":"Silent exclusion isn’t allowed."}],"a":1,"r":"SOP-GSOC-016"},{"id":"e16","q":"Which of these is NOT grounds for immediate decertification?","o":[{"t":"Record falsification.","w":"That is grounds (SOP-GSOC-002)."},{"t":"A critical control deviation.","w":"That is grounds."},{"t":"Failing a reassessment.","w":"That is grounds."},{"t":"One record returned for a missing timestamp.","w":"That’s a deficiency to fix. Repeated deviation leads to retraining, and decertification is for the three listed causes (SOP-GSOC-002, A8)."}],"a":3,"r":"SOP-GSOC-002"},{"id":"e17","q":"A decertified operator wants back in. What does it take?","o":[{"t":"Your approval.","w":"Re-entry sits above the Supervisor."},{"t":"Program Director approval and a documented remediation plan.","w":"That’s the requirement (SOP-GSOC-002)."},{"t":"Thirty days off the floor.","w":"Time isn’t the requirement."},{"t":"Passing the written test again.","w":"Reassessment may be part of the plan, but approval and the plan come first."}],"a":1,"r":"SOP-GSOC-002"},{"id":"e18","q":"When does a legal hold start?","o":[{"t":"When a subpoena arrives.","w":"Don’t wait for formal notice (SOP-GSOC-018)."},{"t":"On any indication of litigation, a claim, regulatory action, or a law-enforcement request.","w":"That’s the trigger."},{"t":"When the Program Director decides there’s a case.","w":"The hold goes on immediately. The Director registers it and is the one who releases it."},{"t":"At the next retention review.","w":"Far too late."}],"a":1,"r":"SOP-GSOC-018"},{"id":"e19","q":"Disposal day arrives. When do you confirm no hold applies?","o":[{"t":"When the retention schedule was set.","w":"Holds can start any time after that."},{"t":"Immediately before disposal.","w":"Verified right before, not at the point the schedule was set (SOP-GSOC-018)."},{"t":"Once a quarter.","w":"A quarterly check can miss yesterday’s hold."},{"t":"Never. If the period’s elapsed, it goes.","w":"A hold overrides the schedule."}],"a":1,"r":"SOP-GSOC-018"},{"id":"e20","q":"Keeping evidence past its retention period “just in case” is:","o":[{"t":"The conservative choice.","w":"The SOP says the opposite."},{"t":"A data-protection exposure, not a safe choice.","w":"That’s the language of SOP-GSOC-018."},{"t":"Fine if the client agrees.","w":"Retention is set by the annex and the law, not a phone call."},{"t":"Required for Level 5 events.","w":"Only a hold extends retention."}],"a":1,"r":"SOP-GSOC-018"},{"id":"e21","q":"A failed item in a site acceptance test has been fixed. What runs next?","o":[{"t":"A re-test of that item.","w":"Partial re-tests aren’t accepted."},{"t":"The full acceptance test, again.","w":"That’s the rule (SOP-GSOC-004)."},{"t":"Nothing. The SME’s word is enough.","w":"Not evidence."},{"t":"Go-live, with a 30-day watch on that item.","w":"No site goes live with an open item."}],"a":1,"r":"SOP-GSOC-004"},{"id":"e22","q":"The client runs a 24-hour security desk on a rota. For the matrix, what do you list?","o":[{"t":"The desk manager by name.","w":"A named person who leaves is a silent failure."},{"t":"The duty line.","w":"Duty functions are preferred over named individuals where a rota exists (SOP-GSOC-003)."},{"t":"Whoever answered last time.","w":"That’s not a matrix entry."},{"t":"The client’s main switchboard.","w":"Not an escalation contact."}],"a":1,"r":"SOP-GSOC-003"},{"id":"e23","q":"A site sits in a verified-response jurisdiction. What should the operator make clear to the dispatcher?","o":[{"t":"That the alarm panel triggered.","w":"That’s an unverified alarm, which may not get a dispatch at all."},{"t":"That the event is visually verified and being observed live.","w":"Visual verification is what makes the GSOC’s report actionable there (SOP-GSOC-011)."},{"t":"That the client has a permit.","w":"Permit conditions may matter, but they’re not the point of the call."},{"t":"Nothing different from usual.","w":"It’s the one thing that matters most in that jurisdiction."}],"a":1,"r":"SOP-GSOC-011"},{"id":"e24","q":"Police are approaching an armed subject on camera. The operator wants to use talk-down. Your guidance?","o":[{"t":"Always use it. It deters.","w":"It can also escalate."},{"t":"Only if it won’t raise the risk to responders or anyone on scene. When in doubt, don’t.","w":"That’s the condition in SOP-GSOC-011, and it applies only where talk-down is authorized."},{"t":"Use it to tell the subject police are coming.","w":"That could raise the risk to responders."},{"t":"Ask the client first.","w":"There’s no time, and it isn’t their call in the moment."}],"a":1,"r":"SOP-GSOC-011"},{"id":"e25","q":"Which statement about scope is right?","o":[{"t":"Supervisors can approve small additions to scope during a shift.","w":"Not open to Supervisor discretion (A1)."},{"t":"A capability has to be in an executed SOW before the GSOC delivers it, and that isn’t open to Supervisor discretion.","w":"That’s Part A, A1."},{"t":"A client email is enough for a temporary addition.","w":"The GSOC doesn’t monitor to an email (SOP-GSOC-003)."},{"t":"Anything that protects life is automatically in scope.","w":"Life safety outranks scope in the moment, but that doesn’t add contracted services."}],"a":1,"r":"SOP-GSOC-000 A1"}]}</script>

}

function hash(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h>>>0; }
function rng(seed){ let a = seed>>>0; return ()=>{ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function shuffle(n, seed){ const a = [...Array(n).keys()]; const r = seed==null ? Math.random : rng(seed); for(let i=n-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

/* ---------------- activity registry ---------------- */
const ACTS = {}; const UNIT_ACTS = {};
UNITS.forEach(u=>{ UNIT_ACTS[u.id] = []; u.blocks.forEach(b=>{ if(b.act){ b.act.unit = u.id; ACTS[b.act.id] = b.act; UNIT_ACTS[u.id].push(b.act.id); } }); });
function AS(id){ if(!S.act[id]) S.act[id] = {}; return S.act[id]; }
const RT = {sel:{}};
function markDone(id){ const st = AS(id); if(!st.done){ st.done = true; st.doneAt = Date.now(); } save(); }
function unitDone(uid){ return UNIT_ACTS[uid].every(id => S.act[id] && S.act[id].done); }
function unitCount(uid){ return UNIT_ACTS[uid].filter(id => S.act[id] && S.act[id].done).length; }
function simBest(id){ return !!(S.sims[id] && S.sims[id].best); }
function examPassed(){ return S.exam.attempts.some(a => a.pass); }
function progress(){
  const acts = Object.keys(ACTS); let done = acts.filter(id => S.act[id] && S.act[id].done).length;
  done += SIMS.filter(s => simBest(s.id)).length;
  done += S.exam.attempts.length ? 1 : 0;
  const total = acts.length + SIMS.length + 1;
  return Math.round(done/total*100);
}

/* ---------------- navigation ---------------- */
const VIEWS = ['start', ...UNITS.map(u=>u.id), 'sim', 'exam', 'rec'];
let VIEW = 'start';
function renderRail(){
  const mk = (id, n, label, ok) => `<button class="nav${VIEW===id?' on':''}" data-go="${id}" ${VIEW===id?'aria-current="page"':''}><span class="n">${n}</span><span>${esc(label)}</span><span class="ok ${ok?'y':'p'}" aria-label="${ok?'Done':'Not done'}">${ok?'✓':''}</span></button>`;
  let h = `<h2>Begin</h2>` + mk('start', '', 'Start here', !!S.name);
  h += `<h2>Units, in SOP order</h2>`;
  UNITS.forEach(u => { h += mk(u.id, u.n, u.short, unitDone(u.id)); });
  h += `<h2>Apply it</h2>`;
  h += mk('sim', '', 'Critical situations', SIMS.every(s=>simBest(s.id)));
  h += mk('exam', '', 'Practice assessment', examPassed());
  h += mk('rec', '', 'Your records', false).replace(/<span class="ok[^>]*>[^<]*<\/span>/, '<span></span>');
  h += `<p class="railfoot">${esc(META.id)}, ${esc(META.version)}. Where this module and a controlled SOP disagree, the SOP wins.</p>`;
  $('#rail').innerHTML = h;
}
function renderProg(){ const p = progress(); $('#progBar').style.width = p + '%'; $('#progTxt').textContent = p + '% complete'; }
function go(v, opts={}){
  if(!VIEWS.includes(v)) v = 'start';
  VIEW = v; S.view = v; save();
  try{ history.replaceState(null, '', '#' + v); }catch(e){}
  if(v !== 'sim') RT.simOpen = null;
  render();
  closeRail();
  if(!opts.keepScroll){ window.scrollTo(0, 0); $('#main').focus({preventScroll:true}); }
}
function render(){
  renderRail(); renderProg();
  const m = $('#main');
  if(VIEW === 'start') m.innerHTML = vStart();
  else if(VIEW === 'sim') m.innerHTML = vSim();
  else if(VIEW === 'exam') m.innerHTML = vExam();
  else if(VIEW === 'rec') m.innerHTML = vRec();
  else m.innerHTML = vUnit(UNITS.find(u => u.id === VIEW));
  if(VIEW === 'start') animateLadder();
}
function refreshAct(id){
  const el = document.getElementById('act-' + id); if(!el) return;
  const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  el.outerHTML = rAct(ACTS[id]);
  renderRail(); renderProg();
  if(fk){ const f = document.querySelector(`[data-k="${CSS.escape(fk)}"]`); if(f) f.focus({preventScroll:true}); }
}
function footer(){ return `<p class="foot">Practice module, ${esc(META.version)}. Interactive scores here are practice, not the gate: certification is decided under SOP-GSOC-002. Where this module and a controlled SOP disagree, the SOP wins. Values marked ${cf('[CONFIRM]')} aren’t set for your program yet.</p>`; }

/* ---------------- start view ---------------- */
