  const lad = D.ladder.map(r => `<li class="${r.k}" data-k="${r.k}"><span class="num">${r.n}</span><span class="nm">${esc(r.name)}</span><span class="wh">${esc(r.who)}</span></li>`).join('');
  return `<div class="cover wide">
    <img class="banner" src="${BANNER}" alt="Specialized. Setting the Standard in Security.">
    <p class="kicker">${esc(META.id)}, ${esc(META.version)}</p>
    <h1>${esc(META.title)}</h1>
    <p class="sub">${esc(META.sub)}</p>
    <p class="lede">You’ve spent time on the console. This module is about the seat behind it. Operators act on alerts. You hold the floor: you make the Level 2 calls, notify the client at Level 4, declare degraded operations, close the records, and keep the standard from drifting when the shift gets ugly.</p>
    <div class="covergrid">
      <div>
        <ol class="ladder${S.seenLadder?'':' pre'}" id="ladder" aria-label="The six escalation levels, highest first">${lad}</ol>
        <p class="ladcap">The six escalation levels. Filled rungs are yours to action. The outlined rung is where you run the parallel notifications while the operator stays on the emergency call.</p>
      </div>
      <div class="startbox">
        <h3>How this works</h3>
        <ol>
          <li>Nine units follow the SOP library from governance to records. Each has short teaching, hands-on activities, and a knowledge check.</li>
          <li>Critical situations has six branching scenarios with several endings each. Go back a step and try another path whenever you like.</li>
          <li>The practice assessment is 25 questions, with the reasoning behind every option, right or wrong.</li>
        </ol>
        <p class="hint">Progress saves in this browser as you go. Your records page exports a CSV and can move your progress to another machine.</p>
        <label class="fld" for="nm">Your name, as it should appear on your training record</label>
        <input class="txt" id="nm" data-k="nm" autocomplete="name" value="${esc(S.name)}" placeholder="First and last name">
        <div class="btnrow"><button class="btn pri" data-a="begin">${anyProgress()?'Pick up where you left off':'Start unit 1'}</button></div>
      </div>
    </div>
    <p class="anchor">Over-escalation is recoverable. Under-escalation is not.<span>If you remember one line from this module, make it that one, and make sure your floor hears you say it.</span></p>

  </div>`;

function anyProgress(){ return Object.keys(S.act).length > 0 || Object.keys(S.sims).length > 0; }
function animateLadder(){
  const lad = $('#ladder'); if(!lad || S.seenLadder) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = [...lad.children].reverse();
  if(reduce){ lad.classList.remove('pre'); S.seenLadder = true; save(); return; }
  items.forEach(li => { li.dataset.cls = li.className; li.className = ''; });
  lad.classList.remove('pre');
  items.forEach((li, i) => setTimeout(() => { li.className = li.dataset.cls; }, 380 + i*170));
  S.seenLadder = true; save();
}
function nextView(){
  for(const u of UNITS){ if(!unitDone(u.id)) return u.id; }
  if(!SIMS.every(s => simBest(s.id))) return 'sim';
  return 'exam';
}

/* ---------------- unit view ---------------- */
function vUnit(u){
  const idx = UNITS.indexOf(u);
  const n = UNIT_ACTS[u.id].length, d = unitCount(u.id);
  let h = `<article class="wide">
    <p class="kicker">Unit ${u.n} of ${UNITS.length}. ${d} of ${n} activities done</p>
    <h1>${esc(u.title)}</h1>
    <div class="refs">${u.refs.map(r=>`<span class="ref">${esc(r)}</span>`).join('')}</div>
    <p class="lede">${cf(u.lede)}</p>`;
  u.blocks.forEach(b => {
    if(b.h) h += `<h2 class="sec">${esc(b.h)}</h2>`;
    else if(b.p) h += `<p class="col">${cf(b.p)}</p>`;
    else if(b.ul) h += `<ul class="points col">${b.ul.map(x=>`<li>${cf(x)}</li>`).join('')}</ul>`;
    else if(b.ctrl) h += `<aside class="ctrl col"><div class="lab">${IC.ctrl}Control <span class="src">${esc(b.src)}</span></div><blockquote>${cf(b.ctrl)}</blockquote>${b.note?`<p class="yournote"><b>For you as Supervisor.</b> ${cf(b.note)}</p>`:''}</aside>`;
    else if(b.act) h += rAct(b.act);
  });
  const prev = idx > 0 ? UNITS[idx-1] : null, next = idx < UNITS.length-1 ? UNITS[idx+1] : null;
  h += `<nav class="pager" aria-label="Unit navigation">
    ${prev?`<button data-go="${prev.id}"><small>Previous</small>Unit ${prev.n}. ${esc(prev.short)}</button>`:`<button data-go="start"><small>Previous</small>Start here</button>`}
    ${next?`<button class="nx" data-go="${next.id}"><small>Next</small>Unit ${next.n}. ${esc(next.short)}</button>`:`<button class="nx" data-go="sim"><small>Next</small>Critical situations</button>`}
  </nav>${footer()}</article>`;
  return h;
}
function rAct(a){
  const st = AS(a.id); const [ic, lab] = KIND[a.type];
  let body = '';
  if(a.type === 'sort') body = rSort(a, st);
  else if(a.type === 'reveal') body = rReveal(a, st);
  else if(a.type === 'order') body = rOrder(a, st);
  else if(a.type === 'hotspot') body = rHot(a, st);
  else body = rDecide(a, st);
  return `<section class="act" id="act-${a.id}" aria-labelledby="t-${a.id}">
    <header><div class="kind">${IC[ic]}<span>${lab}</span>${st.done?`<span class="done">${IC.check.replace('viewBox','width="14" height="14" viewBox')}Done</span>`:''}</div>
    <h3 id="t-${a.id}">${esc(a.title)}</h3>${a.intro?`<p class="ins">${cf(a.intro)}</p>`:''}</header>
    <div class="body">${body}</div></section>`;
}

/* sort */
function rSort(a, st){
  st.place = st.place || {};
  const ord = shuffle(a.items.length, hash(a.id));
  const sel = RT.sel[a.id];
  const itemBtn = (i, inBin) => `<button class="item" draggable="${st.checked?'false':'true'}" data-a="pick" data-id="${a.id}" data-i="${i}" data-k="${a.id}-i${i}" data-drag="${a.id}|${i}" aria-pressed="${sel===i?'true':'false'}">${cf(esc(a.items[i].t))}</button>`;
  if(st.checked){
    let h = `<div class="bins">`;
    a.bins.forEach(b => {
      const inb = ord.filter(i => st.place[i] === b.id);
      h += `<div class="bin" style="cursor:default"><div class="binhead">${esc(b.label)}<span class="c">${inb.length}</span></div><ul class="binlist">${inb.map(i => {
        const it = a.items[i], ok = it.b === b.id;
        const right = ok ? '' : ` <b>Belongs in: ${esc(a.bins.find(x=>x.id===it.b).label)}.</b>`;
        return `<li class="res ${ok?'y':'n'}"><span class="mk">${ok?'✓':'✕'}</span>${esc(it.t)}<span class="why">${right} ${cf(it.w)}</span></li>`;
      }).join('')}</ul></div>`;
    });
    h += `</div>`;
    const c = ord.filter(i => st.place[i] === a.items[i].b).length;
    h += `<div class="btnrow"><span class="score">${c} of ${a.items.length} placed correctly.</span>${st.first?`<span class="hint">First try: ${st.first.c} of ${st.first.n}.</span>`:''}<button class="btn" data-a="sortReset" data-id="${a.id}" data-k="${a.id}-reset">Try it again</button></div>`;
    return h;
  }
  const pool = ord.filter(i => !(i in st.place));
  let h = `<div class="${sel!=null?'armed':''}"><div class="pool${pool.length?'':' empty'}" data-drop="${a.id}|" aria-label="Unplaced items">${pool.length ? pool.map(i=>itemBtn(i)).join('') : 'Everything’s placed. Check your sort when you’re ready.'}</div>`;
  h += `<div class="bins">`;
  a.bins.forEach(b => {
    const inb = ord.filter(i => st.place[i] === b.id);
    h += `<div class="bin" data-a="put" data-id="${a.id}" data-bin="${b.id}" data-drop="${a.id}|${b.id}"><button class="binhead" data-a="put" data-id="${a.id}" data-bin="${b.id}" data-k="${a.id}-b${b.id}" aria-label="Place selected item in ${esc(b.label)}">${esc(b.label)}<span class="c">${inb.length}</span></button><ul class="binlist">${inb.map(i=>`<li>${itemBtn(i, true)}</li>`).join('')}</ul></div>`;
  });
  h += `</div></div>`;
  if(sel != null) h += `<div class="tray" role="group" aria-label="Place the selected item"><span class="trl">Place “${esc(a.items[sel].t.length>46?a.items[sel].t.slice(0,44)+'…':a.items[sel].t)}” in</span><div class="trb">${a.bins.map(b=>`<button class="btn" data-a="put" data-id="${a.id}" data-bin="${b.id}" data-k="${a.id}-t${b.id}">${esc(b.label)}</button>`).join('')}</div></div>`;
  h += `<div class="btnrow"><button class="btn pri" data-a="sortCheck" data-id="${a.id}" data-k="${a.id}-chk" ${pool.length?'disabled':''}>Check my sort</button><span class="hint">${pool.length ? `${pool.length} left to place. ${sel!=null?'Now choose a box.':'Pick an item, then a box.'}` : 'Tap a placed item to move it back.'}</span></div>`;
  return h;
}

/* reveal */
function rReveal(a, st){
  st.open = st.open || [];
  return `<ol class="ledger">${a.items.map((it, i) => {
    const o = st.open.includes(i);
    return `<li><div class="lf"><p>${cf(it.f)}</p>${o?'':`<button class="btn" data-a="open" data-id="${a.id}" data-i="${i}" data-k="${a.id}-o${i}">Open</button>`}</div>${o?`<div class="lb">${cf(it.b)}</div>`:''}</li>`;
  }).join('')}</ol><div class="btnrow"><span class="hint">${st.open.length} of ${a.items.length} opened.</span></div>`;
}

/* order */
function rOrder(a, st){
  if(!st.seq){
    let s = shuffle(a.steps.length, hash(a.id + 'o'));
    if(s.every((v,i)=>v===i)) s.reverse();
    st.seq = s;
  }
  const n = st.seq.length;
  let h = `<ol class="order">${st.seq.map((si, pos) => {
    const cls = st.checked ? (si === pos ? 'y' : 'n') : '';
    return `<li class="${cls}" draggable="${st.checked?'false':'true'}" data-odrag="${a.id}|${pos}"><span class="pos">${pos+1}</span><span class="txt grip">${esc(a.steps[si].t)}</span>${st.checked?`<span class="pos" aria-label="${si===pos?'Correct':'Should be step '+(si+1)}">${si===pos?'✓':'→ '+(si+1)}</span>`:`<span class="mv"><button data-a="mv" data-id="${a.id}" data-p="${pos}" data-d="-1" data-k="${a.id}-u${si}" aria-label="Move up: ${esc(a.steps[si].t)}" ${pos===0?'disabled':''}>↑</button><button data-a="mv" data-id="${a.id}" data-p="${pos}" data-d="1" data-k="${a.id}-d${si}" aria-label="Move down: ${esc(a.steps[si].t)}" ${pos===n-1?'disabled':''}>↓</button></span>`}</li>`;
  }).join('')}</ol>`;
  if(st.checked){
    const c = st.seq.filter((v,i)=>v===i).length;
    h += `<div class="seqkey"><b>The sequence</b><ol>${a.steps.map(s=>`<li>${esc(s.t)}${s.w?`. <span>${cf(esc(s.w))}</span>`:''}</li>`).join('')}</ol></div>`;
    h += `<div class="btnrow"><span class="score">${c} of ${n} in the right position.</span>${st.first?`<span class="hint">First try: ${st.first.c} of ${st.first.n}.</span>`:''}<button class="btn" data-a="ordReset" data-id="${a.id}" data-k="${a.id}-reset">Scramble and try again</button></div>`;
  } else {
    h += `<div class="btnrow"><button class="btn pri" data-a="ordCheck" data-id="${a.id}" data-k="${a.id}-chk">Check the order</button></div>`;
  }
  return h;
}

/* hotspot */
function rHot(a, st){
  st.hit = st.hit || []; st.shown = !!st.shown;
  const flaws = a.lines.map((l,i)=>l.f?i:-1).filter(i=>i>=0);
  const found = st.hit.filter(i => a.lines[i].f).length;
  const falsePos = st.hit.filter(i => !a.lines[i].f).length;
  const complete = st.shown || found === flaws.length;
  let h = `<div class="doc"><div class="dochead"><b>${esc(a.doc.title)}</b><span>${esc(a.doc.meta)}</span></div><ol class="lines">`;
  a.lines.forEach((l, i) => {
    const hit = st.hit.includes(i);
    let cls = '', note = '';
    if(hit && l.f){ cls = 'fl'; note = `<div class="lnote fl"><b>Problem.</b> ${cf(esc(l.f))}</div>`; }
    else if(hit){ cls = 'cl'; note = `<div class="lnote cl">This line holds up.</div>`; }
    else if(st.shown && l.f){ cls = 'ms'; note = `<div class="lnote ms"><b>Missed.</b> ${cf(esc(l.f))}</div>`; }
    h += `<li><button class="line ${cls}" data-a="hit" data-id="${a.id}" data-i="${i}" data-k="${a.id}-l${i}" ${hit||complete?'disabled':''} aria-label="Line ${i+1}: ${esc(l.t)}${hit?(l.f?'. Flagged as a problem':'. Holds up'):''}"><span class="ln">${i+1}</span><span>${cf(esc(l.t))}</span></button>${note}</li>`;
  });
  h += `</ol></div>`;
  h += `<div class="counter"><span><span class="big">${found}</span> of ${flaws.length} problems found</span>${falsePos?`<span class="hint">${falsePos} line${falsePos>1?'s':''} flagged that hold${falsePos>1?'':'s'} up</span>`:''}${!complete?`<button class="btn ghost" data-a="hotShow" data-id="${a.id}" data-k="${a.id}-show">Show what I missed</button>`:''}</div>`;
  if(complete && a.verdict){
    h += `<div class="verdict">${rQ(a.id, 'v', a.verdict, st.vpick, null, true)}</div>`;
  }
  if(complete && st.first) h += `<div class="btnrow"><span class="hint">First pass: ${st.first.c} of ${st.first.n} found before reveal.</span><button class="btn" data-a="hotReset" data-id="${a.id}" data-k="${a.id}-reset">Start the review again</button></div>`;
  return h;
}

/* decide and knowledge checks share one question renderer */
function rQ(aid, key, q, pick, num, lettered){
  const answered = pick != null;
  const correctIdx = q.a != null ? q.a : q.o.findIndex(o => o.ok);
  let h = `<div class="dcard">${num?`<div class="qn">${num}</div>`:''}<p class="sit">${cf(q.q || q.s)}</p><div class="opts" role="group">`;
  q.o.forEach((o, i) => {
    let cls = 'opt';
    if(answered){ if(i === pick) cls += ' pick ' + (i===correctIdx?'y':'n'); else if(i === correctIdx) cls += ' key'; else cls += ' dim'; }
    h += `<button class="${cls}" data-a="ans" data-id="${aid}" data-q="${key}" data-i="${i}" data-k="${aid}-${key}-${i}" ${answered?'disabled':''}><span class="L">${lettered?L(i):'·'}</span><span>${cf(o.t)}</span></button>`;
  });
  h += `</div>`;
  if(answered){
    const ok = pick === correctIdx;
    h += `<div class="fb ${ok?'y':'n'}"><div class="v">${ok?IC.check.replace('viewBox','width="16" height="16" viewBox'):IC.x.replace('viewBox','width="16" height="16" viewBox')}${ok?'Right call':'Not this one'}</div><p>${cf(q.o[pick].w)}</p>${ok?'':`<p class="alt"><b>Better: ${cf(q.o[correctIdx].t)}</b> ${cf(q.o[correctIdx].w)}</p>`}${q.r?`<p class="refline">Source: ${esc(q.r)}</p>`:''}</div>`;
  }
  return h + `</div>`;
}
function rDecide(a, st){
  st.pick = st.pick || {};
  const list = a.type === 'check' ? a.qs : a.cards;
  const lettered = a.type === 'check';
  let h = `<div class="cards">`;
  list.forEach((q, i) => { h += rQ(a.id, String(i), q, st.pick[i], lettered ? `Question ${i+1} of ${list.length}` : `${i+1} of ${list.length}`, lettered); });
  h += `</div>`;
  const n = Object.keys(st.pick).length;
  if(n === list.length){
    const c = list.filter((q,i) => st.pick[i] === (q.a!=null?q.a:q.o.findIndex(o=>o.ok))).length;
    h += `<div class="btnrow"><span class="score">${c} of ${list.length} right.</span>${st.first?`<span class="hint">First try: ${st.first.c} of ${st.first.n}.</span>`:''}<button class="btn" data-a="decReset" data-id="${a.id}" data-k="${a.id}-reset">Clear and try again</button></div>`;
  } else h += `<div class="btnrow"><span class="hint">${n} of ${list.length} answered.</span></div>`;
  return h;
}

/* ---------------- activity actions ---------------- */
function placeItem(id, i, bin){
  const st = AS(id); st.place = st.place || {};
  if(bin) st.place[i] = bin; else delete st.place[i];
  RT.sel[id] = null; save(); refreshAct(id);
  const a = ACTS[id]; const pool = a.items.length - Object.keys(st.place).length;
  live(bin ? `Placed in ${a.bins.find(b=>b.id===bin).label}. ${pool} left.` : `Moved back. ${pool} left.`);
}
function onAct(t){
  const id = t.dataset.id, a = ACTS[id], st = id ? AS(id) : null, act = t.dataset.a;
  if(act === 'pick'){
    if(st.checked) return;
    const i = +t.dataset.i;
    if(st.place && (i in st.place)){ placeItem(id, i, null); RT.sel[id] = i; refreshAct(id); return; }
    RT.sel[id] = RT.sel[id] === i ? null : i; refreshAct(id);
    if(RT.sel[id] != null) live('Selected. Now choose a box.');
  }
  else if(act === 'put'){
    if(st.checked) return;
    const sel = RT.sel[id];
    if(sel == null){ toast('Pick an item first, then choose its box.'); return; }
    placeItem(id, sel, t.dataset.bin);
  }
  else if(act === 'sortCheck'){
    st.checked = true;
    const c = a.items.filter((it,i)=>st.place[i]===it.b).length;
    if(!st.first) st.first = {c, n:a.items.length};
    markDone(id); refreshAct(id); live(`${c} of ${a.items.length} correct.`);
  }
  else if(act === 'sortReset'){ st.place = {}; st.checked = false; RT.sel[id] = null; save(); refreshAct(id); }
  else if(act === 'open'){
    st.open = st.open || []; const i = +t.dataset.i; if(!st.open.includes(i)) st.open.push(i);
    if(st.open.length === a.items.length) markDone(id); else save();
    refreshAct(id);
    const nx = document.querySelector(`[data-a="open"][data-id="${id}"]`); if(nx) nx.focus({preventScroll:true});
  }
  else if(act === 'mv'){
    const p = +t.dataset.p, d = +t.dataset.d, q = p + d; if(q < 0 || q >= st.seq.length) return;
    [st.seq[p], st.seq[q]] = [st.seq[q], st.seq[p]]; save(); refreshAct(id);
    live(`Moved to position ${q+1}.`);
  }
  else if(act === 'ordCheck'){
    st.checked = true; const c = st.seq.filter((v,i)=>v===i).length;
    if(!st.first) st.first = {c, n:st.seq.length};
    markDone(id); refreshAct(id); live(`${c} of ${st.seq.length} in the right position.`);
  }
  else if(act === 'ordReset'){ st.checked = false; let s = shuffle(st.seq.length); if(s.every((v,i)=>v===i)) s.reverse(); st.seq = s; save(); refreshAct(id); }
  else if(act === 'hit'){
    st.hit = st.hit || []; const i = +t.dataset.i; if(st.hit.includes(i)) return; st.hit.push(i);
    const flaws = a.lines.filter(l=>l.f).length, found = st.hit.filter(j=>a.lines[j].f).length;
    if(found === flaws && !st.first) st.first = {c:found, n:flaws};
    save(); refreshAct(id);
    live(a.lines[i].f ? `Problem found. ${found} of ${flaws}.` : 'That line holds up.');
  }
  else if(act === 'hotShow'){
    const flaws = a.lines.filter(l=>l.f).length, found = (st.hit||[]).filter(j=>a.lines[j].f).length;
    st.shown = true; if(!st.first) st.first = {c:found, n:flaws}; save(); refreshAct(id);
  }
  else if(act === 'hotReset'){ st.hit = []; st.shown = false; st.vpick = null; save(); refreshAct(id); }
  else if(act === 'ans'){
    const key = t.dataset.q, i = +t.dataset.i;
    if(key === 'v'){ st.vpick = i; markDone(id); refreshAct(id); return; }
    st.pick = st.pick || {}; if(st.pick[key] != null) return; st.pick[key] = i;
    const list = a.type === 'check' ? a.qs : a.cards;
    if(Object.keys(st.pick).length === list.length){
      const c = list.filter((q,j) => st.pick[j] === (q.a!=null?q.a:q.o.findIndex(o=>o.ok))).length;
      if(!st.first) st.first = {c, n:list.length};
      st.missed = st.missed || {};
      list.forEach((q,j)=>{ const ci = q.a!=null?q.a:q.o.findIndex(o=>o.ok); if(st.pick[j]!==ci) st.missed[j] = (st.missed[j]||0)+1; });
      markDone(id);
    } else save();
    refreshAct(id);
    const q = list[+key]; const ci = q.a!=null?q.a:q.o.findIndex(o=>o.ok);
    live(i === ci ? 'Right call.' : 'Not this one. The explanation is below the options.');
  }
  else if(act === 'decReset'){ st.pick = {}; save(); refreshAct(id); }
}

/* ---------------- simulator ---------------- */
function simState(id){ if(!S.sims[id]) S.sims[id] = {path:[SIMS.find(s=>s.id===id).start], ends:[], best:false}; return S.sims[id]; }
const RATE = {best:'Best outcome', rec:'Recoverable', poor:'Poor outcome', fail:'Control failure'};
function vSim(){
  if(RT.simOpen) return vScenario(SIMS.find(s=>s.id===RT.simOpen));
  const done = SIMS.filter(s=>simBest(s.id)).length;
  let h = `<article class="wide"><p class="kicker">Apply it. ${done} of ${SIMS.length} scenarios solved</p><h1>Critical situations</h1>
  <p class="lede">Six nights and days where the Supervisor’s decisions decide how it ends. Every scenario has several endings, and most of them are wrong in instructive ways. Find the best outcome in each, and go back a step whenever you want to see where a different call leads.</p>
  <div class="scen">`;
  SIMS.forEach(s => {
    const st = S.sims[s.id]; const ends = Object.values(s.nodes).filter(n=>n.end).length;
    const found = st ? st.ends.length : 0;
    h += `<button class="scard" data-a="simOpen" data-s="${s.id}"><span class="t">${esc(s.title)}</span><span class="w">${esc(s.when)}</span><span class="tags">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span><span class="st">${st&&st.best?`<span class="b">✓ Best outcome found</span>`:''}<span>${found} of ${ends} endings found</span></span></button>`;
  });
  h += `</div>`;
  h += `<nav class="pager"><button data-go="u9"><small>Previous</small>Unit 9. ${esc(UNITS[8].short)}</button><button class="nx" data-go="exam"><small>Next</small>Practice assessment</button></nav>${footer()}</article>`;
  return h;
}
function vScenario(s){
  const st = simState(s.id); const cur = st.path[st.path.length-1]; const node = s.nodes[cur];
  const endsAll = Object.entries(s.nodes).filter(([k,n])=>n.end);
  let h = `<article class="wide"><button class="btn ghost" data-a="simList" data-k="simlist">← All scenarios</button>
  <div class="simhead"><h1 style="margin-bottom:4px">${esc(s.title)}</h1></div><p class="when">${esc(s.when)}</p>
  <div class="brief">${cf(esc(s.brief))}</div>`;
  const steps = st.path.filter(p=>!s.nodes[p].end).length;
  h += `<div class="trail" aria-label="Decisions made">${st.path.map((p,i)=>`<i>${s.nodes[p].end?'■':i+1}</i>`).join('')}<span>${node.end?'Ending reached':`Decision ${steps}`}</span></div>`;
  if(node.end){
    h += `<div class="ending" tabindex="-1" id="endcard"><span class="badge ${node.end}">${RATE[node.end]}</span><h3>${esc(node.title)}</h3><p>${cf(esc(node.t))}</p><p class="refline hint">Source: ${node.refs.map(esc).join(', ')}</p>
      <div class="btnrow">${st.path.length>1?`<button class="btn pri" data-a="simBack" data-s="${s.id}" data-k="simback">Go back one step</button>`:''}<button class="btn" data-a="simRestart" data-s="${s.id}" data-k="simrestart">Start this scenario again</button>${nextSim(s.id)?`<button class="btn ghost" data-a="simOpen" data-s="${nextSim(s.id)}">Next scenario</button>`:''}</div></div>`;
  } else {
    h += `<div class="situ"><p class="t">${cf(esc(node.t))}</p><div role="group" aria-label="Your options">${node.c.map((c,i)=>`<button class="choice" data-a="simGo" data-s="${s.id}" data-i="${i}" data-k="simc${i}">${cf(esc(c.t))}</button>`).join('')}</div>
    ${st.path.length>1?`<div class="btnrow"><button class="btn ghost" data-a="simBack" data-s="${s.id}" data-k="simback">Go back one step</button></div>`:''}</div>`;
  }
  h += `<ul class="endlist" aria-label="Endings">${endsAll.map(([k,n])=>{ const f = st.ends.includes(k); return `<li><span class="dot ${f?n.end:'none'}"></span>${f?`<span><b>${RATE[n.end]}.</b> ${esc(n.title)}</span>`:`<span class="lk">Not found yet</span>`}</li>`; }).join('')}</ul>`;
  h += footer() + `</article>`;
  return h;
}
function nextSim(id){ const i = SIMS.findIndex(s=>s.id===id); return SIMS[i+1] ? SIMS[i+1].id : null; }
function onSim(t){
  const act = t.dataset.a, sid = t.dataset.s;
  if(act === 'simOpen'){ RT.simOpen = sid; render(); window.scrollTo(0,0); $('#main').focus({preventScroll:true}); return; }
  if(act === 'simList'){ RT.simOpen = null; render(); window.scrollTo(0,0); return; }
  const s = SIMS.find(x=>x.id===sid), st = simState(sid);
  if(act === 'simGo'){
    const node = s.nodes[st.path[st.path.length-1]]; const to = node.c[+t.dataset.i].to; st.path.push(to);
    const nn = s.nodes[to];
    if(nn.end){ if(!st.ends.includes(to)) st.ends.push(to); if(nn.end === 'best'){ st.best = true; st.bestAt = st.bestAt || Date.now(); } }
    save(); render();
    const target = nn.end ? $('#endcard') : $('.situ');
    if(target){ target.scrollIntoView({block:'start', behavior:'auto'}); if(nn.end) target.focus({preventScroll:true}); }
    live(nn.end ? `${RATE[nn.end]}. ${nn.title}` : 'Next decision.');
  }
  else if(act === 'simBack'){ if(st.path.length > 1) st.path.pop(); save(); render(); const s2=$('.situ'); if(s2) s2.scrollIntoView({block:'start'}); }
  else if(act === 'simRestart'){ st.path = [s.start]; save(); render(); window.scrollTo(0,0); }
}

/* ---------------- exam ---------------- */
function newAttempt(){
  const order = shuffle(EXAM.length);
  const opt = {}; EXAM.forEach((q,i)=>{ opt[i] = shuffle(q.o.length); });
  S.exam.cur = {order, opt, pos:0, picks:{}, started:Date.now()}; save();
}
function vExam(){
  const ex = S.exam; const pm = Math.round(META.pass*100);
  let h = `<article class="wide"><p class="kicker">Apply it</p><h1>Practice assessment</h1>`;
  if(!ex.cur){
    const last = ex.attempts[ex.attempts.length-1];
    if(last) h += rResult(last);
    h += `<p class="lede">${EXAM.length} questions across the whole manual, in random order. Each one shows the reasoning as soon as you answer: why the right option is right, and why the one you picked isn’t, if it isn’t.</p>
    <p class="col">The working pass mark is ${pm} percent ${cf('[CONFIRM]')}. This is practice. Your certification is decided under SOP-GSOC-002, on the instrument your Training Lead issues.</p>
    <div class="btnrow"><button class="btn pri" data-a="exStart" data-k="exstart">${last?'Take it again':'Start the assessment'}</button>${ex.attempts.length?`<span class="hint">${ex.attempts.length} attempt${ex.attempts.length>1?'s':''} so far.</span>`:''}</div>`;
    if(ex.attempts.length > 1) h += `<h2 class="sec">Earlier attempts</h2>${rAttempts()}`;
  } else {
    const c = ex.cur; const qi = c.order[c.pos]; const q = EXAM[qi];
    const view = {q:q.q, o:c.opt[qi].map(j=>q.o[j]), a:c.opt[qi].indexOf(q.a), r:q.r};
    const pick = c.picks[qi] != null ? c.opt[qi].indexOf(c.picks[qi]) : null;
    const answered = Object.keys(c.picks).length;
    h += `<p class="kicker">Question ${c.pos+1} of ${EXAM.length}. ${answered} answered</p><div class="qbar" aria-hidden="true"><i style="width:${(answered/EXAM.length*100).toFixed(1)}%"></i></div>`;
    h += `<div class="col" id="exq">${rQ('__exam', String(qi), view, pick, null, true)}</div>`;
    h += `<div class="btnrow">${pick!=null ? (c.pos < EXAM.length-1 ? `<button class="btn pri" data-a="exNext" data-k="exnext">Next question</button>` : `<button class="btn pri" data-a="exFinish" data-k="exfinish">See my result</button>`) : '<span class="hint">Choose an answer to see the reasoning.</span>'}<button class="btn ghost" data-a="exQuit" data-k="exquit">Leave and resume later</button></div>`;
  }
  h += footer() + `</article>`;
  return h;
}
function rResult(at){
  const pct = Math.round(at.score/at.total*100);
  let h = `<div class="result"><span class="pct">${pct}%</span><span class="lbl">${at.pass?'At or above the working pass mark':'Below the working pass mark'}</span><span class="det">${at.score} of ${at.total} right. ${new Date(at.date).toLocaleString()}</span></div>`;
  if(at.miss && at.miss.length){
    h += `<h2 class="sec">Review what you missed</h2>`;
    at.miss.forEach(m => { const q = EXAM.find(x=>x.id===m.id); if(!q) return; h += `<details class="miss"><summary>${cf(q.q)}</summary><div><p><b>You chose:</b> ${cf(q.o[m.p].t)} <span class="hint">${cf(q.o[m.p].w)}</span></p><p><b>Answer:</b> ${cf(q.o[q.a].t)} ${cf(q.o[q.a].w)}</p><p class="hint">Source: ${esc(q.r)}</p></div></details>`; });
  }
  return h;
}
function rAttempts(){
  return `<div class="tblwrap"><table class="tbl"><thead><tr><th>#</th><th>Date</th><th>Score</th><th>Result</th></tr></thead><tbody>${S.exam.attempts.map((a,i)=>`<tr><td>${i+1}</td><td>${new Date(a.date).toLocaleString()}</td><td>${a.score} of ${a.total} (${Math.round(a.score/a.total*100)}%)</td><td><span class="pill ${a.pass?'y':'w'}">${a.pass?'At or above mark':'Below mark'}</span></td></tr>`).join('')}</tbody></table></div>`;
}
function onExam(t){
  const act = t.dataset.a; const ex = S.exam;
  if(act === 'exStart'){ newAttempt(); render(); window.scrollTo(0,0); }
  else if(act === 'exNext'){ ex.cur.pos++; save(); render(); window.scrollTo(0,0); const f=$('.opt'); if(f) f.focus({preventScroll:true}); }
  else if(act === 'exQuit'){ go('start'); toast('Saved. The assessment will resume where you left it.'); }
  else if(act === 'exFinish'){
    const c = ex.cur; let score = 0; const miss = [];
    EXAM.forEach((q,i)=>{ if(c.picks[i] === q.a) score++; else miss.push({id:q.id, p:c.picks[i]}); });
    ex.attempts.push({date:Date.now(), score, total:EXAM.length, pass: score/EXAM.length >= META.pass, miss});
    ex.cur = null; save(); render(); window.scrollTo(0,0);
  }
}
function onExamAnswer(t){
  const c = S.exam.cur; const qi = +t.dataset.q; if(c.picks[qi] != null) return;
  const shown = +t.dataset.i; c.picks[qi] = c.opt[qi][shown]; save();
  const q = EXAM[qi];
  const view = {q:q.q, o:c.opt[qi].map(j=>q.o[j]), a:c.opt[qi].indexOf(q.a), r:q.r};
  $('#exq').innerHTML = rQ('__exam', String(qi), view, shown, null, true);
  render(); const nb = $('[data-k="exnext"]') || $('[data-k="exfinish"]'); 
  const fb = $('.fb'); if(fb) fb.scrollIntoView({block:'nearest'});
  if(nb) nb.focus({preventScroll:true});
  live(c.picks[qi] === q.a ? 'Right call.' : 'Not this one. The explanation follows.');
}

/* ---------------- records ---------------- */
function vRec(){
  const acts = Object.values(ACTS);
  const dn = acts.filter(a=>S.act[a.id]&&S.act[a.id].done).length;
  const best = S.exam.attempts.reduce((m,a)=>Math.max(m, Math.round(a.score/a.total*100)), 0);
  let h = `<article class="wide"><p class="kicker">Your records</p><h1>Training record</h1>
  <p class="lede">Everything you’ve done in this module, as it stands in this browser. Export it for the Training Lead, or move it to another machine with the progress code.</p>
  <label class="fld" for="nm2">Learner name</label><input class="txt col" id="nm2" data-k="nm2" value="${esc(S.name)}" placeholder="First and last name">
  <div class="stats" style="margin-top:22px"><div class="stat"><b>${progress()}%</b><span>Module complete</span></div><div class="stat"><b>${UNITS.filter(u=>unitDone(u.id)).length}/${UNITS.length}</b><span>Units done</span></div><div class="stat"><b>${SIMS.filter(s=>simBest(s.id)).length}/${SIMS.length}</b><span>Scenarios solved</span></div><div class="stat"><b>${S.exam.attempts.length?best+'%':'None'}</b><span>Best assessment score</span></div></div>`;
  h += `<h2 class="sec">Units</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Unit</th><th>Activities</th><th>First-try score on scored activities</th><th>Status</th></tr></thead><tbody>`;
  UNITS.forEach(u=>{
    let c=0,n=0; UNIT_ACTS[u.id].forEach(id=>{ const f = S.act[id]&&S.act[id].first; if(f){ c+=f.c; n+=f.n; } });
    h += `<tr><td>${u.n}. ${esc(u.short)}</td><td>${unitCount(u.id)} of ${UNIT_ACTS[u.id].length}</td><td>${n?`${c} of ${n} (${Math.round(c/n*100)}%)`:'None yet'}</td><td><span class="pill ${unitDone(u.id)?'y':'n'}">${unitDone(u.id)?'Done':'In progress'}</span></td></tr>`;
  });
  h += `</tbody></table></div>`;
  h += `<h2 class="sec">Critical situations</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Scenario</th><th>Endings found</th><th>Best outcome</th></tr></thead><tbody>`;
  SIMS.forEach(s=>{ const st=S.sims[s.id]; const ends = Object.values(s.nodes).filter(n=>n.end).length; h += `<tr><td>${esc(s.title)}</td><td>${st?st.ends.length:0} of ${ends}</td><td><span class="pill ${st&&st.best?'y':'n'}">${st&&st.best?'Found':'Not yet'}</span></td></tr>`; });
  h += `</tbody></table></div>`;
  h += `<h2 class="sec">Practice assessment</h2>${S.exam.attempts.length?rAttempts():'<p class="col hint">No attempts yet.</p>'}`;
  const weak = weakest();
  h += `<h2 class="sec">Worth another look</h2>${weak.length?`<p class="col">Questions you’ve missed, most often first. Knowledge checks count your first try only.</p><div class="tblwrap"><table class="tbl"><thead><tr><th>Question</th><th>Where</th><th>Missed</th></tr></thead><tbody>${weak.slice(0,10).map(w=>`<tr><td>${cf(w.q)}</td><td>${esc(w.where)}</td><td>${w.n}</td></tr>`).join('')}</tbody></table></div>`:'<p class="col hint">Nothing missed yet, or nothing attempted yet.</p>'}`;
  h += `<h2 class="sec">Export and move</h2>
  <div class="btnrow" id="dlrow"><button class="btn pri" data-a="csv" data-k="csv">Download record as CSV</button><span class="hint" id="dlhint"></span></div>
  <label class="fld" for="pc">Progress code</label>
  <textarea class="txt" id="pc" readonly data-k="pc">${esc(progressCode())}</textarea>
  <div class="btnrow"><button class="btn" data-a="copyCode" data-k="copy">Copy progress code</button></div>
  <label class="fld" for="pcin">Load progress from another machine</label>
  <textarea class="txt" id="pcin" data-k="pcin" placeholder="Paste a progress code here"></textarea>
  <div class="btnrow"><button class="btn" data-a="loadCode" data-k="load">Load this progress</button><button class="btn ghost" data-a="wipe" data-k="wipe">Clear all progress</button></div>
  ${footer()}</article>`;
  return h;
}
function weakest(){
  const out = [];
  Object.values(ACTS).forEach(a=>{ if(a.type!=='check') return; const st=S.act[a.id]; if(!st||!st.missed) return; Object.entries(st.missed).forEach(([k,n])=>{ out.push({q:a.qs[+k].q, where:`Unit ${UNITS.find(u=>u.id===a.unit).n} check`, n}); }); });
  const em = {}; S.exam.attempts.forEach(at=>(at.miss||[]).forEach(m=>{ em[m.id]=(em[m.id]||0)+1; }));
  Object.entries(em).forEach(([id,n])=>{ const q=EXAM.find(x=>x.id===id); if(q) out.push({q:q.q, where:'Assessment', n}); });
  return out.sort((a,b)=>b.n-a.n);
}
function progressCode(){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }catch(e){ return ''; } }
function csvCell(v){ const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }
function buildCSV(){
  const rows = [['learner','module','version','section','activity','type','first_try_correct','first_try_total','completed','completed_at']];
  const nm = S.name || '';
  UNITS.forEach(u=>UNIT_ACTS[u.id].forEach(id=>{ const a=ACTS[id], st=S.act[id]||{}; rows.push([nm, META.id, META.version, `Unit ${u.n} ${u.short}`, a.title, a.type, st.first?st.first.c:'', st.first?st.first.n:'', st.done?'yes':'no', st.doneAt?new Date(st.doneAt).toISOString():'']); }));
  SIMS.forEach(s=>{ const st=S.sims[s.id]; const ends = Object.values(s.nodes).filter(n=>n.end).length; rows.push([nm, META.id, META.version, 'Critical situations', s.title, 'scenario', st?st.ends.length:0, ends, st&&st.best?'yes':'no', st&&st.bestAt?new Date(st.bestAt).toISOString():'']); });
  S.exam.attempts.forEach((a,i)=>rows.push([nm, META.id, META.version, 'Practice assessment', `Attempt ${i+1}`, a.pass?'assessment, at or above working mark':'assessment, below working mark', a.score, a.total, 'yes', new Date(a.date).toISOString()]));
  return rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}
let DL = undefined;
async function initDownloads(){
  try{
    if(window.claude && typeof window.claude.use === 'function'){ DL = await window.claude.use('downloads'); }
    else DL = 'local';
  }catch(e){ DL = null; }
  if(VIEW === 'rec') syncDl();
}
function syncDl(){ const row = $('#dlrow'); if(!row) return; if(DL === null){ $('[data-a="csv"]').style.display='none'; $('#dlhint').textContent = 'Downloads aren’t available in this view. Copy the progress code instead.'; } }
async function saveCSV(){
  const fn = `${META.id}_record_${(S.name||'learner').replace(/[^A-Za-z0-9]+/g,'-')}_${new Date().toISOString().slice(0,10)}.csv`;
  const data = buildCSV();
  if(DL && DL !== 'local'){
    try{ await DL.save({filename:fn, data}); toast('Saved.'); }
    catch(e){ if(e && e.code === 'declined') toast('Save cancelled.'); else if(e && e.code === 'rate_limited') toast('A save prompt is already open.'); else toast('Saving isn’t available here. Copy the progress code instead.'); }
    return;
  }
  if(DL === 'local'){
    const b = new Blob([data], {type:'text/csv'}); const u = URL.createObjectURL(b);
    const l = document.createElement('a'); l.href = u; l.download = fn; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 2000);
    return;
  }
  toast('Saving isn’t available here. Copy the progress code instead.');
}
function onRec(t){
  const act = t.dataset.a;
  if(act === 'csv') saveCSV();
  else if(act === 'copyCode'){
    const ta = $('#pc'); const v = ta.value;
    const done = () => toast('Progress code copied.');
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(done, ()=>{ ta.select(); toast('Selected. Copy it with your keyboard.'); }); }
    else { ta.select(); toast('Selected. Copy it with your keyboard.'); }
  }
  else if(act === 'loadCode'){
    const v = $('#pcin').value.trim(); if(!v){ toast('Paste a progress code first.'); return; }
    try{ const o = JSON.parse(decodeURIComponent(escape(atob(v)))); if(!o || o.v !== 1 || !o.act) throw 0; S = o; S.view = 'rec'; save(); render(); toast('Progress loaded.'); }
    catch(e){ toast('That code didn’t load. Check you copied all of it.'); }
  }
  else if(act === 'wipe'){
    if(t.dataset.armed === '1'){ const nm = S.name; S = fresh(); S.name = nm; S.seenLadder = true; save(); go('start'); toast('Progress cleared.'); }
    else { t.dataset.armed = '1'; t.textContent = 'Click again to clear everything'; setTimeout(()=>{ if(t.isConnected){ t.dataset.armed=''; t.textContent='Clear all progress'; } }, 4000); }
  }
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const t = e.target.closest('[data-a]'); if(!t || t.disabled) return;
  const a = t.dataset.a;
  if(a === 'begin'){ const nm = $('#nm'); if(nm){ S.name = nm.value.trim(); save(); } go(nextView()); return; }
  if(a === 'ans' && t.dataset.id === '__exam'){ onExamAnswer(t); return; }
  if(a.startsWith('sim')){ onSim(t); return; }
  if(a.startsWith('ex')){ onExam(t); return; }
  if(['csv','copyCode','loadCode','wipe'].includes(a)){ onRec(t); return; }
  onAct(t);
});
document.addEventListener('input', e => {
  if(e.target.id === 'nm' || e.target.id === 'nm2'){ S.name = e.target.value.trim(); save(); }
});
document.addEventListener('change', e => { if(e.target.id === 'nm' || e.target.id === 'nm2') renderRail(); });

/* drag and drop for sorts */
let DRAG = null;
document.addEventListener('dragstart', e => {
  const it = e.target.closest && e.target.closest('[data-drag]');
  if(it){ DRAG = {kind:'sort', v:it.dataset.drag}; it.classList.add('dragging'); try{ e.dataTransfer.setData('text/plain', it.dataset.drag); e.dataTransfer.effectAllowed = 'move'; }catch(x){} return; }
  const li = e.target.closest && e.target.closest('[data-odrag]');
  if(li){ DRAG = {kind:'order', v:li.dataset.odrag}; try{ e.dataTransfer.setData('text/plain', li.dataset.odrag); e.dataTransfer.effectAllowed = 'move'; }catch(x){} }
});
document.addEventListener('dragend', e => { document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging')); document.querySelectorAll('.hot,.dragover').forEach(x=>x.classList.remove('hot','dragover')); DRAG = null; });
document.addEventListener('dragover', e => {
  if(!DRAG) return;
  if(DRAG.kind === 'sort'){ const z = e.target.closest('[data-drop]'); if(z && z.dataset.drop.split('|')[0] === DRAG.v.split('|')[0]){ e.preventDefault(); document.querySelectorAll('.hot').forEach(x=>x!==z&&x.classList.remove('hot')); z.classList.add('hot'); } }
  else { const li = e.target.closest('[data-odrag]'); if(li && li.dataset.odrag.split('|')[0] === DRAG.v.split('|')[0]){ e.preventDefault(); document.querySelectorAll('.dragover').forEach(x=>x!==li&&x.classList.remove('dragover')); li.classList.add('dragover'); } }
});
document.addEventListener('drop', e => {
  if(!DRAG) return;
  if(DRAG.kind === 'sort'){
    const z = e.target.closest('[data-drop]'); if(!z) return; e.preventDefault();
    const [id, i] = DRAG.v.split('|'); const [zid, bin] = z.dataset.drop.split('|'); if(id !== zid) return;
    if(AS(id).checked) return;
    placeItem(id, +i, bin || null);
  } else {
    const li = e.target.closest('[data-odrag]'); if(!li) return; e.preventDefault();
    const [id, from] = DRAG.v.split('|'); const [lid, to] = li.dataset.odrag.split('|'); if(id !== lid) return;
    const st = AS(id); if(st.checked) return;
    const v = st.seq.splice(+from, 1)[0]; st.seq.splice(+to, 0, v); save(); refreshAct(id);
  }
  DRAG = null;
});

/* mobile rail */
function closeRail(){ $('#rail').classList.remove('open'); $('#scrim').classList.remove('on'); $('#menuBtn').setAttribute('aria-expanded','false'); }
$('#menuBtn').addEventListener('click', () => { const r = $('#rail'); const o = !r.classList.contains('open'); r.classList.toggle('open', o); $('#scrim').classList.toggle('on', o); $('#menuBtn').setAttribute('aria-expanded', String(o)); });
$('#scrim').addEventListener('click', closeRail);
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeRail(); });

/* start */
const h0 = (location.hash || '').replace('#','');
VIEW = VIEWS.includes(h0) ? h0 : (VIEWS.includes(S.view) ? S.view : 'start');
render();
initDownloads();
window.addEventListener('hashchange', () => { const h = (location.hash||'').replace('#',''); if(VIEWS.includes(h) && h !== VIEW) go(h); });
})();
</script>
