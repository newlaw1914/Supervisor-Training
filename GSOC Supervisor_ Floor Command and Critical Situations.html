<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GSOC Supervisor: Floor Command and Critical Situations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F5; --surface:#FFFFFF; --surface-2:#E8EAEF; --sunk:#E3E5EA; --line:#D3D6DD; --line-2:#BFC3CB;
  --ink:#000000; --text:#15171B; --muted:#565C62; --faint:#7B8187;
  --accent:#3F1DF8; --accent-ink:#FFFFFF; --accent-text:#3F1DF8; --accent-soft:rgba(63,29,248,.075); --accent-line:rgba(63,29,248,.38);
  --good:#16704B; --good-soft:rgba(22,112,75,.09); --warn:#8C5A00; --warn-soft:rgba(176,120,0,.11); --bad:#C0332B; --bad-soft:rgba(192,51,43,.085);
  --doc:#FCFCFD; --doc-line:#E6E8EC; --shadow:0 1px 0 rgba(0,0,0,.04);
  --sans:'Archivo','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0D0E13; --surface-2:#15171E; --sunk:#090A0E; --line:#262833; --line-2:#363946;
    --ink:#FFFFFF; --text:#E8EAEF; --muted:#9BA1A4; --faint:#6F757A;
    --accent:#512FFF; --accent-ink:#FFFFFF; --accent-text:#A897FF; --accent-soft:rgba(81,47,255,.15); --accent-line:rgba(130,108,255,.5);
    --good:#56BA8D; --good-soft:rgba(86,186,141,.13); --warn:#E2AE45; --warn-soft:rgba(226,174,69,.13); --bad:#EC6A61; --bad-soft:rgba(236,106,97,.13);
    --doc:#08090C; --doc-line:#1C1E26; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0D0E13; --surface-2:#15171E; --sunk:#090A0E; --line:#262833; --line-2:#363946;
  --ink:#FFFFFF; --text:#E8EAEF; --muted:#9BA1A4; --faint:#6F757A;
  --accent:#512FFF; --accent-ink:#FFFFFF; --accent-text:#A897FF; --accent-soft:rgba(81,47,255,.15); --accent-line:rgba(130,108,255,.5);
  --good:#56BA8D; --good-soft:rgba(86,186,141,.13); --warn:#E2AE45; --warn-soft:rgba(226,174,69,.13); --bad:#EC6A61; --bad-soft:rgba(236,106,97,.13);
  --doc:#08090C; --doc-line:#1C1E26; --shadow:none; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
img{max-width:100%}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:14px;height:58px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:18px;height:17px;color:var(--accent-text)}
.wordmark{font-stretch:125%;font-weight:600;letter-spacing:.3em;font-size:12.5px}
.topname{font-size:14px;color:var(--muted);padding-left:14px;border-left:1px solid var(--line);white-space:nowrap}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{width:132px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s ease}
.menu{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:calc(100vh - 58px)}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);height:calc(100vh - 58px - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);padding:18px 12px 40px;background:var(--surface)}
.rail h2{font-size:12.5px;font-weight:600;color:var(--faint);margin:18px 10px 6px;letter-spacing:.01em}
.rail h2:first-child{margin-top:4px}
.nav{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;font-size:14.5px;line-height:1.3;color:var(--text)}
.nav:hover{background:var(--surface-2)}
.nav.on{background:var(--accent-soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.nav .n{font-stretch:115%;font-weight:600;color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums}
.nav.on .n{color:var(--accent-text)}
.nav .ok{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px}
.nav .ok.y{background:var(--good);color:#fff}
.nav .ok.p{border:1.5px solid var(--line-2)}
.railfoot{margin:22px 10px 0;font-size:12.5px;color:var(--faint);line-height:1.5}
main{padding:40px 52px 120px;min-width:0}
.col{max-width:740px}
.wide{max-width:880px}

/* ---------- type ---------- */
h1{font-stretch:125%;font-weight:640;font-size:clamp(30px,4.6vw,46px);line-height:1.04;letter-spacing:-.015em;margin:4px 0 16px;color:var(--ink)}
h2.sec{font-stretch:112%;font-weight:620;font-size:22px;line-height:1.2;letter-spacing:-.005em;margin:44px 0 12px;color:var(--ink)}
h3{font-stretch:108%;font-weight:620;font-size:18.5px;line-height:1.25;margin:4px 0 6px;color:var(--ink)}
p{margin:0 0 14px}
.lede{font-size:19px;line-height:1.55;color:var(--text);max-width:680px}
.kicker{font-size:14px;color:var(--muted);margin:0 0 4px;font-variant-numeric:tabular-nums}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.ref{font-size:12.5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.cf{font-size:.82em;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn);white-space:nowrap;letter-spacing:.02em}
ul.points{margin:0 0 16px;padding:0;list-style:none}
ul.points li{position:relative;padding:7px 0 7px 22px;border-bottom:1px solid var(--line)}
ul.points li:last-child{border-bottom:0}
ul.points li::before{content:"";position:absolute;left:2px;top:17px;width:8px;height:8px;border-radius:2px;background:var(--accent)}

/* control callout */
.ctrl{margin:22px 0;padding:18px 20px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--accent-line);box-shadow:inset 4px 0 0 var(--accent)}
.ctrl .lab{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;color:var(--accent-text);margin-bottom:6px}
.ctrl .lab svg{width:15px;height:15px}
.ctrl .lab .src{font-weight:500;color:var(--muted)}
.ctrl blockquote{margin:0;font-size:17px;line-height:1.5;color:var(--ink);font-weight:500}
.ctrl .yournote{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:15.5px;color:var(--text)}

/* ---------- activity frame ---------- */
.act{margin:28px 0 30px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.act>header{padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.kind{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:6px}
.kind svg{width:15px;height:15px;color:var(--accent-text)}
.kind .done{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--good);font-weight:600}
.act .ins{margin:0;color:var(--muted);font-size:15.5px}
.act .body{padding:18px 22px 20px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:1px solid var(--line-2);background:var(--surface);padding:9px 16px;border-radius:9px;font-size:15px;font-weight:550}
.btn:hover{border-color:var(--accent-line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{border-color:transparent;background:none;color:var(--accent-text);padding-left:6px;padding-right:6px}
.hint{font-size:14px;color:var(--muted)}
.score{font-size:15px;font-weight:600;color:var(--ink)}

/* sort */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:12px;border:1.5px dashed var(--line-2);border-radius:10px;background:var(--sunk)}
.pool.empty{align-items:center;color:var(--muted);font-size:14.5px}
.item{display:inline-block;text-align:left;border:1px solid var(--line-2);background:var(--surface);padding:8px 12px;border-radius:8px;font-size:15px;line-height:1.35;max-width:100%;touch-action:manipulation}
.item:hover{border-color:var(--accent-line)}
.item[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.item.dragging{opacity:.4}
.bins{display:grid;gap:12px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.bin{border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:110px;display:flex;flex-direction:column;cursor:pointer}
.bin.hot{border-color:var(--accent);background:var(--accent-soft)}
.armed .bin{border-style:dashed;border-color:var(--accent-line)}
.binhead{display:flex;justify-content:space-between;gap:8px;align-items:center;border:0;border-bottom:1px solid var(--line);background:var(--surface-2);padding:9px 12px;border-radius:10px 10px 0 0;font-weight:620;font-size:14.5px;text-align:left;color:var(--ink)}
.binhead .c{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.binlist{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column;gap:6px}
.binlist .item{width:100%}
.res{border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:14.5px;line-height:1.4}
.res.y{border-color:color-mix(in srgb,var(--good) 45%,transparent);background:var(--good-soft)}
.res.n{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.res .mk{font-weight:700;margin-right:4px}
.res.y .mk{color:var(--good)} .res.n .mk{color:var(--bad)}
.res .why{display:block;margin-top:4px;color:var(--text);font-size:14px}
.res .why b{color:var(--ink)}

/* reveal ledger */
.ledger{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ledger li{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lf{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:13px 16px;background:var(--surface)}
.lf p{margin:0;font-weight:520;color:var(--ink)}
.lb{padding:13px 16px 14px;background:var(--surface-2);border-top:1px solid var(--line);font-size:15.5px;animation:open .22s ease}
.lb b{color:var(--ink)}
@keyframes open{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}

/* order */
.order{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.order li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px 8px 8px 12px;background:var(--surface)}
.order li.dragover{border-color:var(--accent);box-shadow:0 -3px 0 var(--accent)}
.order .pos{font-stretch:120%;font-weight:650;color:var(--faint);font-variant-numeric:tabular-nums}
.order .mv{display:flex;gap:4px}
.order .mv button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;display:grid;place-items:center;font-size:14px}
.order .mv button[disabled]{opacity:.3}
.order li.y{border-color:color-mix(in srgb,var(--good) 50%,transparent);background:var(--good-soft)}
.order li.n{border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:var(--bad-soft)}
.order li .grip{cursor:grab}
.seqkey{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--surface-2)}
.seqkey ol{margin:6px 0 0;padding-left:22px}
.seqkey li{margin:0 0 6px}
.seqkey li span{color:var(--muted)}

/* decide and checks */
.cards{display:flex;flex-direction:column;gap:14px}
.dcard{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface)}
.dcard .sit{margin:0 0 12px;font-size:16px;color:var(--ink)}
.dcard .qn{font-size:13px;color:var(--faint);margin-bottom:4px;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);padding:10px 12px;font-size:15.5px;line-height:1.4}
.opt .L{font-weight:650;color:var(--faint);font-stretch:115%}
.opt:hover:not([disabled]){border-color:var(--accent-line);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.opt.pick.y{border-color:var(--good);background:var(--good-soft)}
.opt.pick.n{border-color:var(--bad);background:var(--bad-soft)}
.opt.key{border-color:var(--good)}
.opt.dim{opacity:.55}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:15.5px;animation:open .22s ease}
.fb.y{background:var(--good-soft)} .fb.n{background:var(--bad-soft)}
.fb .v{display:flex;align-items:center;gap:7px;font-weight:700;margin-bottom:4px}
.fb.y .v{color:var(--good)} .fb.n .v{color:var(--bad)}
.fb p{margin:0 0 8px} .fb p:last-child{margin:0}
.fb .alt{padding-top:8px;border-top:1px solid color-mix(in srgb,var(--text) 14%,transparent)}
.fb .refline{font-size:13.5px;color:var(--muted)}

/* hotspot document */
.doc{border:1px solid var(--line);border-radius:6px;background:var(--doc);overflow:hidden}
.dochead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:14px}
.dochead b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.dochead span{color:var(--muted)}
.lines{list-style:none;margin:0;padding:0;overflow-x:auto}
.lines li{border-bottom:1px solid var(--doc-line)}
.lines li:last-child{border-bottom:0}
.line{display:grid;grid-template-columns:30px 1fr;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 14px;font-family:var(--mono);font-size:13.6px;line-height:1.5;color:var(--text)}
.line:hover:not([disabled]){background:var(--accent-soft)}
.line .ln{color:var(--faint);font-variant-numeric:tabular-nums}
.line.fl{background:var(--bad-soft)} .line.fl .ln{color:var(--bad);font-weight:600}
.line.cl{background:var(--surface-2)}
.line.ms{background:var(--warn-soft)}
.line[disabled]{cursor:default}
.lnote{font-family:var(--sans);font-size:14.5px;padding:2px 14px 11px 54px;line-height:1.45}
.lnote.fl{background:var(--bad-soft)} .lnote.cl{background:var(--surface-2);color:var(--muted)} .lnote.ms{background:var(--warn-soft)}
.lnote b{color:var(--ink)}
.counter{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:12px 0 0;font-size:15px}
.counter .big{font-stretch:120%;font-weight:680;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.verdict{margin-top:18px}

/* ---------- cover ---------- */
.banner{display:block;width:100%;height:auto;max-height:150px;object-fit:cover;object-position:left center;border-radius:12px;margin:0 0 30px;background:#000}
.cover h1{font-size:clamp(40px,7vw,74px);line-height:.98;letter-spacing:-.02em;margin:0 0 14px}
.cover .sub{font-stretch:110%;font-size:clamp(18px,2.3vw,23px);line-height:1.35;color:var(--muted);margin:0 0 26px;max-width:640px}
.covergrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:start;margin-top:30px}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.ladder li{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:6px 12px;padding:11px 16px 11px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);transition:background .35s ease,border-color .35s ease,color .35s ease}
.ladder li:nth-child(1){margin-left:0}
.ladder li:nth-child(2){margin-left:4%}
.ladder li:nth-child(3){margin-left:8%}
.ladder li:nth-child(4){margin-left:12%}
.ladder li:nth-child(5){margin-left:16%}
.ladder li:nth-child(6){margin-left:20%}
.ladder .num{font-stretch:125%;font-weight:720;font-size:34px;line-height:1;color:var(--faint);grid-row:span 2}
.ladder .nm{font-weight:620;color:var(--ink);font-size:16px;line-height:1.2}
.ladder .wh{font-size:14px;color:var(--muted);line-height:1.35}
.ladder li.you{background:var(--accent);border-color:var(--accent)}
.ladder li.you .num,.ladder li.you .nm,.ladder li.you .wh{color:#fff}
.ladder li.par{border:2px solid var(--accent)}
.ladder li.par .num{color:var(--accent-text)}
.ladder.pre li{background:var(--surface);border-color:var(--line)}
.ladder.pre li .num{color:var(--faint)} .ladder.pre li .nm{color:var(--ink)} .ladder.pre li .wh{color:var(--muted)}
.ladcap{font-size:14px;color:var(--muted);margin:12px 0 0}
.startbox{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:22px 22px 20px}
.startbox h3{margin-bottom:10px}
.startbox ol{margin:0 0 16px;padding-left:20px}
.startbox li{margin:0 0 7px}
label.fld{display:block;font-size:14.5px;font-weight:600;color:var(--ink);margin:14px 0 6px}
input.txt,textarea.txt{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;background:var(--surface);font-size:15.5px}
textarea.txt{font-family:var(--mono);font-size:12.5px;min-height:90px}
.anchor{margin:36px 0 0;padding:22px 0 0;border-top:1px solid var(--line);font-stretch:118%;font-weight:600;font-size:clamp(20px,2.6vw,27px);line-height:1.25;color:var(--ink);max-width:680px}
.anchor span{display:block;font-stretch:100%;font-weight:400;font-size:15px;color:var(--muted);margin-top:8px}

/* ---------- simulator ---------- */
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:20px}
.scard{text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px}
.scard:hover{border-color:var(--accent-line)}
.scard .t{font-stretch:112%;font-weight:640;font-size:18.5px;color:var(--ink);line-height:1.2}
.scard .w{font-size:14px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{font-size:12.5px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.scard .st{margin-top:auto;padding-top:10px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:center}
.scard .st .b{color:var(--good);font-weight:650}
.simhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin:0 0 8px}
.when{font-size:14.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.brief{padding:14px 16px;border-radius:12px;background:var(--surface-2);margin:0 0 18px;font-size:15.5px}
.trail{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;font-size:13px;color:var(--muted);align-items:center}
.trail i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);font-weight:650}
.situ{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:20px 22px}
.situ p.t{font-size:17.5px;line-height:1.55;color:var(--ink);margin:0 0 16px}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);padding:13px 16px;margin:0 0 9px;font-size:16px;line-height:1.42}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.ending{border-radius:14px;padding:22px 22px 18px;border:1px solid var(--line);background:var(--surface)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:4px 11px;border-radius:99px;margin-bottom:10px}
.badge.best{background:var(--good);color:#fff}
.badge.rec{background:var(--warn-soft);color:var(--warn)}
.badge.poor{background:var(--bad-soft);color:var(--bad)}
.badge.fail{background:var(--bad);color:#fff}
.ending h3{font-size:22px;margin:0 0 10px}
.ending p{font-size:16.5px}
.endlist{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.endlist li{display:flex;gap:10px;align-items:center;font-size:14.5px}
.endlist .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.dot.best{background:var(--good)} .dot.rec{background:var(--warn)} .dot.poor{background:var(--bad);opacity:.6} .dot.fail{background:var(--bad)} .dot.none{border:1.5px solid var(--line-2)}
.endlist .lk{color:var(--faint)}

/* ---------- exam & records ---------- */
.qbar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:6px 0 18px}
.qbar i{display:block;height:100%;background:var(--accent)}
.result{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:center;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:0 0 20px}
.result .pct{font-stretch:125%;font-weight:720;font-size:56px;line-height:1;color:var(--ink);grid-row:span 2;font-variant-numeric:tabular-nums}
.result .lbl{font-size:17px;font-weight:620;color:var(--ink)}
.result .det{font-size:14.5px;color:var(--muted)}
details.miss{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0 0 8px}
details.miss summary{cursor:pointer;padding:11px 14px;font-weight:550;color:var(--ink);list-style-position:inside}
details.miss div{padding:0 14px 12px;font-size:15px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:0 0 22px}
.tbl th,.tbl td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-weight:620;color:var(--muted);background:var(--surface-2);font-size:13.5px}
.tbl tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:12.5px;font-weight:650;padding:2px 9px;border-radius:99px}
.pill.y{background:var(--good-soft);color:var(--good)} .pill.n{background:var(--surface-2);color:var(--muted)} .pill.w{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 24px}
.stat{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px}
.stat b{display:block;font-stretch:122%;font-weight:700;font-size:28px;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted)}

/* ---------- footer, pager, toast ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin:48px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:12px 16px;text-align:left;max-width:48%;font-size:15px}
.pager button:hover{border-color:var(--accent-line)}
.pager small{display:block;font-size:12.5px;color:var(--muted)}
.pager .nx{margin-left:auto;text-align:right}
.foot{margin:34px 0 0;font-size:13.5px;color:var(--faint);max-width:740px;line-height:1.55}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14.5px;transition:all .25s ease;z-index:80;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.scrim{display:none}
.tray{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--accent);box-shadow:0 8px 28px rgba(0,0,0,.18);animation:open .18s ease}
.trl{display:block;font-size:13.5px;color:var(--muted);margin-bottom:7px}
.trb{display:flex;flex-wrap:wrap;gap:6px}
.trb .btn{padding:7px 12px;font-size:14.5px}

@media (max-width:980px){
  main{padding:30px 26px 110px}
  .covergrid{grid-template-columns:1fr;gap:28px}
}

  .shell{grid-template-columns:1fr}
  .menu{display:inline-block}

  .rail{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + 58px);bottom:0;width:min(300px,86vw);height:auto;z-index:45;transform:translateX(-102%);transition:transform .25s ease,visibility .25s;visibility:hidden}
  .rail.open{transform:none;visibility:visible;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim.on{display:block;position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.35)}
  .prog .bar{width:70px}
}
@media (max-width:560px){
  main{padding:24px 16px 100px}
  .act>header,.act .body{padding-left:15px;padding-right:15px}
  .wordmark{display:none}
  .ladder li{grid-template-columns:42px 1fr;padding:10px 12px}
  .ladder .num{font-size:28px}
  .ladder li:nth-child(n){margin-left:0}
  .pager button{max-width:none;flex:1}
  .lnote{padding-left:14px}
  .result{grid-template-columns:1fr}
  .result .pct{grid-row:auto}
}

  *{animation:none!important;transition:none!important}
}

  .top,.rail,.pager,.btnrow{display:none!important}

  main{padding:0}
}

<script type="application/json" id="data">{"meta":{"id":"GSOC-TRN-S01","title":"GSOC Supervisor","sub":"Floor command, record review, and the calls that can’t wait","version":"v0.1 draft","pass":0.8},"ladder":[{"n":6,"name":"Executive notification","who":"Program Director acts. You get it to them fast.","k":"pd"},{"n":5,"name":"Emergency response","who":"Operator calls immediately. You run the parallel legs.","k":"par"},{"n":4,"name":"Client and management","who":"Yours to action.","k":"you"},{"n":3,"name":"Direct-to-guard dispatch","who":"Operator dispatches. You’re notified.","k":"op"},{"n":2,"name":"Supervisor notification","who":"Yours to decide.","k":"you"},{"n":1,"name":"Monitor and document","who":"Operator. You see it in review.","k":"op"}],"units":[{"id":"u1","n":1,"short":"The seat you’re taking","title":"The seat you’re taking","refs":["SOP-GSOC-000 A1","A3","A4","A7","A8"],"lede":"The manual defines roles by function, not by person. When you take the Supervisor seat, a specific set of decisions becomes yours, and a few that look like yours belong to someone else. Getting that boundary right is most of the job in your first month.","blocks":[{"h":"What the seat owns"},{"ul":["Floor command for the shift, including the coverage gap when someone calls out.","Reviewing and backing operator decisions, and owning the quality of every escalation.","Approving incident closure. Operators never close their own.","Shift KPI performance, and the client reports issued from it.","Declaring degraded operations, and standing them down.","The QA function. Under the KD-1 decisions the Supervisor role carries it, and you sample other shifts, never your own.","The escalation contact matrix, the site profiles, and go-live approval for new sites.","Approving operator certification once Learning and Development recommends it."]},{"h":"What it doesn’t own"},{"p":"Some decisions sit above you on purpose. The Program Director approves every Program Annex, makes the Level 6 executive notification, handles media, attorneys and any release of records, releases legal holds, and accepts residual risk on an open exception. The SOP Lead owns the manual itself, so no floor-level or client-level variation of a procedure is valid unless it’s issued as a controlled revision or written into an approved annex."},{"p":"And one decision sits below you on purpose. An operator facing a life-safety threat calls it in without asking you first."},{"ctrl":"Life safety outranks every other consideration in this manual, including scope, cost, client preference, and chain of command. An operator facing a life-safety threat escalates immediately and seeks approval afterward.","src":"SOP-GSOC-000 A4","note":"Chain of command includes you. Your operators need to know, without any doubt, that you’d rather hear about the call after it’s made."},{"act":{"id":"u1a","type":"sort","title":"Whose call is it?","intro":"Fourteen decisions from a normal month. Put each one with the role that owns it. Drag on a desktop, or tap an item and then tap a box.","bins":[{"id":"op","label":"GSOC Operator"},{"id":"sup","label":"GSOC Supervisor (you)"},{"id":"pd","label":"Program Director"},{"id":"sme","label":"Platform SME"}],"items":[{"t":"Calling emergency services on a verified life-safety threat","b":"op","w":"Level 5 is actioned by the operator, immediately. No supervisor approval first and no waiting for dispatch to finish (A6, SOP-GSOC-011)."},{"t":"Approving an incident record for closure","b":"sup","w":"Closure is a supervisory act. An operator never closes their own incident (SOP-GSOC-008)."},{"t":"Declaring degraded operations","b":"sup","w":"You declare it and record the time, the scope, and which capabilities are affected (A3, SOP-GSOC-013)."},{"t":"Making the Level 6 executive notification","b":"pd","w":"Level 6 is actioned by the Program Director. Your part is getting the facts to them without delay (A6)."},{"t":"Approving a new Program Annex","b":"pd","w":"The Program Director approves every annex. That approval is the gate that lets site onboarding start (A5, SOP-GSOC-003)."},{"t":"Approving an operator’s certification after Learning and Development recommends it","b":"sup","w":"The Training Lead recommends and the Supervisor approves. It’s recorded with date, scope, and expiry (SOP-GSOC-002)."},{"t":"Releasing footage to a detective the morning after an incident","b":"pd","w":"Outside a live emergency, law-enforcement requests route to the Program Director. Supervisors don’t release records directly (SOP-GSOC-012, SOP-GSOC-018)."},{"t":"Bringing a new unit to the approved firmware and configuration baseline","b":"sme","w":"Configuration baselines and technical validation sit with the Platform SME (A3, SOP-GSOC-004)."},{"t":"Covering console 4 after a call-out","b":"sup","w":"Coverage gaps from a staffing shortfall are the Supervisor’s to resolve. An operator doesn’t silently absorb an unassigned console (SOP-GSOC-005)."},{"t":"Notifying the client when an event meets the annex threshold","b":"sup","w":"That’s Level 4, and the Supervisor actions it through the client escalation contact in the annex (A6, SOP-GSOC-012)."},{"t":"Accepting residual risk on an open exception","b":"pd","w":"Residual risk acceptance belongs to the Program Director (A3)."},{"t":"Releasing a legal hold","b":"pd","w":"Holds come off only in writing, from the Program Director, once the matter is confirmed concluded (SOP-GSOC-018)."},{"t":"Opening the incident record at acknowledgement","b":"op","w":"The operator opens it the moment they acknowledge. The record clock starts there, not at closure (SOP-GSOC-001, 6.1)."},{"t":"Assessing what still works on a failed platform","b":"sme","w":"Degraded-capability assessment is a Platform SME function. You declare the degraded state, and they tell you what’s actually available (A3, SOP-GSOC-013)."}]}},{"h":"The five universal controls"},{"p":"These apply to every procedure, without exception. Each one fails in a predictable way on a real floor, and you’re usually the person who sees it first."},{"act":{"id":"u1b","type":"reveal","title":"How each control breaks","intro":"Read the control and think about how it gets broken on a busy night. Then open it and compare.","items":[{"f":"No action is taken on an unverified alert, except under a written exception in the annex approved by the Program Director.","b":"\u003cb>How it breaks.\u003c/b> A site with a long false-alert history gets an officer sent “just in case” without anyone pulling the view, or an operator acts on a phone tip with no look at the feed. \u003cb>Your move.\u003c/b> Send it back to verification. The only exception is one written into the annex and approved by the Program Director. [CONFIRM] whether your program has one."},{"f":"No site is monitored until it has recorded a full pass under SOP-GSOC-004.","b":"\u003cb>How it breaks.\u003c/b> The client’s go-live date arrives and the site goes on the roster with one camera still failing after dark. \u003cb>Your move.\u003c/b> You’re the go-live approver, so hold it. Schedule pressure isn’t a basis for accepting a site."},{"f":"No operator sits a live console without a current certification under SOP-GSOC-002.","b":"\u003cb>How it breaks.\u003c/b> A short-staffed night, a trainee left alone on a live console, or an operator certified on one program covering another. \u003cb>Your move.\u003c/b> Certification is per platform and per program. The target is 100 percent of console hours, and anything less is a control failure, not a number to trend."},{"f":"Life safety outranks every other consideration, including scope, cost, client preference, and chain of command.","b":"\u003cb>How it breaks.\u003c/b> An operator calls you to ask whether they should call it in. \u003cb>Your move.\u003c/b> Tell them to make the call now and take the parallel legs yourself. Then make sure the whole floor knows that’s what you’ll always say."},{"f":"Every action is recorded contemporaneously. An action that isn’t recorded is treated as an action not taken.","b":"\u003cb>How it breaks.\u003c/b> A busy night gets written up from memory at 06:30. \u003cb>Your move.\u003c/b> Return the record. End-of-shift reconstruction is visible to QA, and the timing evidence the KPIs depend on is already gone."}]}},{"h":"Deviations land on your desk"},{"p":"Any deviation from a procedure gets recorded in the record, at the time, with the reason, by the person who deviated. You review every recorded deviation before that record closes."},{"p":"Three situations need more than a review. A deviation from a control is a critical non-compliance, so you report it to the SOP Lead and the Program Director within one shift and it triggers a formal review. Falsifying a record or backdating an entry means immediate removal from the floor, and it isn’t handled as a training matter. And when a deviation shows that a procedure doesn’t work in practice, that’s a defect in the manual. Send it to the SOP Lead as a change request instead of letting the floor quietly work around it."},{"act":{"id":"u1k","type":"check","title":"Check yourself","qs":[{"q":"The client’s overnight duty manager asks your floor to stop placing the shift-start test call to their escalation line. SOP-GSOC-005 requires a test call, not an assumption from a lit indicator. What do you do?","o":[{"t":"Agree, and have operators skip that one test.","w":"That’s a client-level variation of a procedure. It isn’t valid unless it’s issued as a controlled revision or recorded in an approved annex (A7)."},{"t":"Keep the procedure in force, record the request, and send it to the SOP Lead as a change request.","w":"The procedure stands until a controlled revision or an annex change says otherwise. A procedure that clashes with how a client actually operates is a manual question for the SOP Lead, not a floor decision (A7, A8)."},{"t":"Edit the readiness checklist template in SharePoint to remove it for that client.","w":"Templates and the SOP Library are owned and written by the SOP Lead. A Supervisor edit would create an uncontrolled version (A7, Appendix C)."},{"t":"Only test that line on weekends, when the manager isn’t there.","w":"Still a local variation, and now an inconsistent one that’s harder to audit."}],"a":1,"r":"SOP-GSOC-000 A7"},{"q":"An operator dispatched an officer on an alert without pulling the view, because “that site’s always a real person.” That’s a deviation from a control. What happens next?","o":[{"t":"You coach the operator and note it in the passdown.","w":"Coaching may well follow, but a control deviation carries a reporting clock that coaching doesn’t satisfy."},{"t":"You report it to the SOP Lead and the Program Director within one shift, and it triggers a formal review.","w":"Deviation from a CONTROL is a critical non-compliance. It’s reported within one shift and goes to formal review (A8)."},{"t":"It goes into the next periodic QA report.","w":"Critical items aren’t held for the periodic report (A8, SOP-GSOC-015)."},{"t":"Nothing, since the officer found a real intruder.","w":"The outcome doesn’t cure the deviation. The control is about the decision, not how it happened to turn out."}],"a":1,"r":"SOP-GSOC-000 A8"},{"q":"A client regional manager asks the floor to start watching their body-worn camera uploads tonight. The SOW doesn’t mention it. What’s your answer?","o":[{"t":"Start tonight and sort the paperwork out later.","w":"A capability has to be contracted before the GSOC delivers it, and that isn’t open to your discretion (A1)."},{"t":"Decline for now and point them to a contract amendment and annex revision.","w":"Unscoped work isn’t delivered until it’s in an executed SOW and the annex. Reactive programs like post-incident BWC review sit outside this manual entirely (A1, SOP-GSOC-003)."},{"t":"Agree, as long as they confirm it by email.","w":"The GSOC doesn’t monitor to an email, a verbal understanding, or a slide (SOP-GSOC-003)."},{"t":"Put one operator on it part-time.","w":"Same problem, smaller. It’s still unscoped work on a live floor."}],"a":1,"r":"SOP-GSOC-000 A1"}]}}]},{"id":"u2","n":2,"short":"Escalation command","title":"Escalation command","refs":["SOP-GSOC-000 A6","SOP-GSOC-001","SOP-GSOC-011"],"lede":"Six levels, and they aren’t a staircase. A life-safety event enters at Level 5 and notifies up and down at the same time. Your job is knowing which levels you own outright, which ones you support, and what happens when an escalation can’t be finished.","blocks":[{"h":"Your levels"},{"p":"Level 2 is where operators bring you ambiguity, surges, procedural doubt, and repeat activity at one site. It’s also where unresolved classifications, failed dispatches, and consoles that won’t acknowledge end up. Level 4, the client notification, is actioned by the Supervisor. Those two are yours outright."},{"p":"At Level 5 the operator is on the phone with emergency services. The Supervisor and client notifications run in parallel, using a second operator or channel where one exists. In practice that second channel is often you."},{"act":{"id":"u2a","type":"reveal","title":"The six levels from your chair","intro":"For each level, say out loud what your part is before you open it.","items":[{"f":"Level 1. Monitor and document","b":"\u003cb>Trigger.\u003c/b> Alert received, non-actionable or still under assessment. \u003cb>Actioned by.\u003c/b> Operator. \u003cb>You.\u003c/b> Nothing to approve in the moment. You’ll see it in closure review and QA sampling, which is where a vague false-alert cause shows up."},{"f":"Level 2. Supervisor notification","b":"\u003cb>Trigger.\u003c/b> Ambiguity, an alert surge, procedural doubt, repeat activity at one site. Also any classification that can’t be resolved and any dispatch that can’t be completed. \u003cb>You.\u003c/b> You’re the recipient and you make the determination. Don’t hand it back unanswered."},{"f":"Level 3. Direct-to-guard dispatch","b":"\u003cb>Trigger.\u003c/b> A verified actionable event with no life-safety threat. \u003cb>Actioned by.\u003c/b> Operator, who notifies you. \u003cb>You.\u003c/b> Watch the brief and the report-back. A dispatch that fails comes straight back to you at Level 2."},{"f":"Level 4. Client and management notification","b":"\u003cb>Trigger.\u003c/b> An event meeting the notification threshold in the annex. [CONFIRM] threshold per program. \u003cb>Actioned by.\u003c/b> You. \u003cb>Your job.\u003c/b> Notify promptly through the client escalation contact. A client who hears about it from anyone else first is a failure, however well the incident itself went."},{"f":"Level 5. Emergency response","b":"\u003cb>Trigger.\u003c/b> Life-safety threat, crime in progress, fire, medical emergency. \u003cb>Actioned by.\u003c/b> Operator, immediately. \u003cb>You.\u003c/b> Don’t stand between the operator and the call. Supervisor and client notifications run in parallel, by a second operator or channel, and that’s often you."},{"f":"Level 6. Executive notification","b":"\u003cb>Trigger.\u003c/b> Fatality or serious injury, media exposure, a multi-site event, a major service failure, or regulatory contact. \u003cb>Actioned by.\u003c/b> Program Director. \u003cb>You.\u003c/b> Get the facts to the Program Director as soon as a trigger appears. Don’t wait to be sure it’s serious."}]}},{"h":"When an escalation can’t be finished"},{"ctrl":"An escalation that cannot be completed, because a contact is unreachable or a channel failed, is itself escalated one level up without delay. An unanswered call is not a discharged obligation.","src":"SOP-GSOC-000 A6","note":"Read “one level up” as up the chain of authority. SOP-GSOC-010 spells out the dispatch cases: both officer contacts unreachable comes to you at Level 2, and no officer assigned goes to Level 4 for a client decision. If your own Level 4 call goes unanswered, it goes to the Program Director. Every attempt gets its own timestamp."},{"act":{"id":"u2b","type":"sort","title":"Match the trigger to the level","intro":"Ten things that happen on a real floor. Put each one at the level it enters.","bins":[{"id":"l2","label":"Level 2"},{"id":"l3","label":"Level 3"},{"id":"l4","label":"Level 4"},{"id":"l5","label":"Level 5"},{"id":"l6","label":"Level 6"}],"items":[{"t":"Operator can’t classify the alert from the view available","b":"l2","w":"Unresolved isn’t a disposition. It’s a Level 2 for your determination (SOP-GSOC-007)."},{"t":"Verified: two people walking the closed yard after hours, nobody else present, no damage seen","b":"l3","w":"Unauthorized presence, no threat to anyone. Direct-to-guard dispatch (A6, SOP-GSOC-007)."},{"t":"Dispatched officer is past the report-back interval and isn’t answering","b":"l5","w":"After a contact attempt, officer welfare is treated as a potential life-safety matter (SOP-GSOC-010)."},{"t":"Both officer contacts unreachable on a verified, non-life-safety event","b":"l2","w":"Record every attempt with its time and escalate to Level 2 immediately (SOP-GSOC-010)."},{"t":"Verified event at a site with no officer assigned","b":"l4","w":"No officer means the client decides on response, at Level 4 (SOP-GSOC-010)."},{"t":"Smoke coming from a trailer in the yard","b":"l5","w":"Fire is a Level 5 trigger (A6)."},{"t":"The same verified break-in pattern hitting four sites tonight","b":"l6","w":"A multi-site event is a Level 6 trigger (A6)."},{"t":"A TV crew filming the site after a police response","b":"l6","w":"Media exposure is a Level 6 trigger (A6, SOP-GSOC-011)."},{"t":"Six alerts across four sites inside two minutes","b":"l2","w":"A surge is a Level 2. Operators prioritize life safety first and tell you it’s running (SOP-GSOC-001)."},{"t":"An event meets the client notification threshold in the annex","b":"l4","w":"That’s the definition of Level 4, and you action it (A6)."}]}},{"h":"The asymmetry is yours to protect"},{"ctrl":"No operator is ever criticized for escalating an event that turned out to be less serious than it appeared. Operators are held accountable for failing to escalate. This asymmetry is deliberate and is stated to every operator at certification.","src":"SOP-GSOC-011"},{"p":"Operators learn this rule in certification. They learn whether it’s true from you. The first time a client complains about an unnecessary police call, your floor is watching what you say, and one careless “maybe be more sure next time” undoes it. SOP-GSOC-017 even builds in scenarios where escalation turns out to be unnecessary, so trainees hear that it was still the right call."},{"act":{"id":"u2k","type":"check","title":"Check yourself","qs":[{"q":"It’s 01:20. An event meets the Level 4 threshold. You call the client’s primary escalation contact, then the alternate. Neither answers. What now?","o":[{"t":"Leave voicemails and email a summary. The obligation’s met.","w":"An unanswered call isn’t a discharged obligation, and email is never used for anything urgent (A6, SOP-GSOC-012)."},{"t":"Record both attempts with their times and take it up the chain to the Program Director without delay.","w":"A failed escalation is itself escalated, without delay. Every attempt is logged, because an unanswered call at 01:20 is often the most important line in the record (A6, SOP-GSOC-008)."},{"t":"Try again at 06:00 when their day shift starts.","w":"Waiting turns a failed escalation into a missed one."},{"t":"Leave a message on the client’s main switchboard.","w":"That’s not the escalation path in the annex, and nobody has actually been told."}],"a":1,"r":"SOP-GSOC-000 A6"},{"q":"On the floor channel an operator says: “Guy at the loading dock has something in his hand, might be a gun. Want me to call it in?” Best response?","o":[{"t":"“Call it now. I’ve got the client.”","w":"Inconclusive with a plausible life-safety outcome is handled as life-safety. The operator calls without waiting for you, and you take the parallel leg (SOP-GSOC-007, SOP-GSOC-011)."},{"t":"“Send the officer over to get eyes on it first.”","w":"An officer is never the sole response to a possible life-safety threat, and emergency services aren’t held back until the officer reports (SOP-GSOC-010)."},{"t":"“Pull the recorded segment and confirm what it is.”","w":"The decision threshold is deliberately low. Further verification isn’t a reason to delay the call (SOP-GSOC-011)."},{"t":"“Hang on, I’m coming over to look.”","w":"That makes a Level 5 wait for you. It’s the operator’s call, immediately."}],"a":0,"r":"SOP-GSOC-011"},{"q":"EMS arrives for a person slumped in a parked car. It’s a vendor asleep with the AC running. What do you say to the operator who called it?","o":[{"t":"“Next time, watch a little longer before you call.”","w":"That’s criticism for escalating, and it teaches the whole floor to hesitate (SOP-GSOC-011)."},{"t":"“Right call. Let’s make sure the record says what you saw.”","w":"Reinforce the asymmetry out loud, then review the record like any other (SOP-GSOC-011, SOP-GSOC-017)."},{"t":"Nothing. It’s not worth bringing up.","w":"Not harmful, but it misses the moment. Operators believe the rule when they hear you back it."},{"t":"“The client won’t love it, but it’s fine.”","w":"Bringing the client’s annoyance in suggests the call was a problem. It wasn’t."}],"a":1,"r":"SOP-GSOC-011"}]}}]},{"id":"u3","n":3,"short":"Programs, sites and go-live","title":"Programs, sites and go-live","refs":["SOP-GSOC-000 A5","SOP-GSOC-003","SOP-GSOC-004"],"lede":"Before anyone watches a feed, two things have to be true: the program has an approved annex, and the site has passed a full acceptance test. You’re the last signature before a site goes live, and you own the contact matrix every dispatch depends on.","blocks":[{"h":"Scope comes from paper"},{"ctrl":"The GSOC does not monitor to a verbal understanding, an email, or a slide. If a commitment is not in the SOW and not in the annex, it is not in scope, and an operator is not expected to deliver it.","src":"SOP-GSOC-003"},{"p":"Mid-term changes go as a written contract amendment first, then the annex revision, in that order. Brief the floor before the change takes effect, never after. When a site retires, confirm it with the client in writing, set an effective end time, take it off the roster at that moment, brief the floor, and archive the profile. Its records stay. Retention survives the end of monitoring, and a legal hold survives the end of the contract."},{"h":"The matrix is the spine"},{"p":"One entry per site per escalation level, with a primary and at least one alternate. Each entry records the contact or duty function, role, channel, hours of availability, and the date it was last verified. Push the client toward duty lines wherever they run a rota. A named manager who left the company is a silent failure. A duty line isn’t."},{"ctrl":"An unverified or expired contact entry is treated as no contact. The operator escalates one level up rather than attempting an entry known to be stale.","src":"SOP-GSOC-003","note":"Operators check their sites’ entries at shift start. When one fails, they report it to you instead of working around it. The fix is yours: the Escalation Directory is written by the Supervisor. [CONFIRM] verification cycle."},{"act":{"id":"u3b","type":"sort","title":"Tonight’s requests","intro":"Six things that reach you on one shift. Decide what each one is.","bins":[{"id":"go","label":"Deliver it"},{"id":"paper","label":"Not until it’s on paper"},{"id":"nc","label":"Treat as no contact"}],"items":[{"t":"A client director emails: please add the new Elm Street store to monitoring starting tonight.","b":"paper","w":"A new site needs a contract amendment, an annex revision, and a full acceptance pass first (SOP-GSOC-003, SOP-GSOC-004)."},{"t":"Holiday-hours coverage that’s written into the approved annex.","b":"go","w":"It’s in the annex. Deliver it."},{"t":"The Level 4 primary for S-2210 was last verified well past the verification cycle.","b":"nc","w":"An expired entry is treated as no contact. Go to the alternate, escalate up if needed, and get the entry re-verified (SOP-GSOC-003)."},{"t":"A matrix entry names a manager who left the company last month.","b":"nc","w":"A named person who’s gone is a silent failure. Replace the entry, with a duty function where the client has a rota."},{"t":"On a call, the client’s VP asks the floor to keep an eye on one employee they suspect.","b":"paper","w":"A verbal request isn’t scope. Feeds are also viewed only for a legitimate, contracted operational purpose (SOP-GSOC-003, SOP-GSOC-006)."},{"t":"Talk-down at a site where the annex lists it as authorized.","b":"go","w":"Authorized in the annex, so it’s available, used only where it won’t raise the risk to anyone."}]}},{"h":"Go-live is your signature"},{"p":"The acceptance test is run jointly by the Platform SME and a certified operator, working from the production console. Every required view and every communication path has to work end to end. Any failed item is fixed and then the whole test is run again. QA reviews the acceptance record independently, you approve the site, the matrix is finalized, and the floor is told the site is live with an effective date and time."},{"ctrl":"A site is not eligible for monitoring until this test records a full pass. A site is never go-lived with an open item to be fixed later. An item deferred at go-live is an item discovered during an incident.","src":"SOP-GSOC-004","note":"Schedule pressure isn’t a basis for accepting a site. That sentence is in the SOP so you can point at it when someone’s leaning on you."},{"act":{"id":"u3a","type":"decide","title":"Approve or hold?","intro":"Five acceptance packets land on your desk. Make the call on each, then read why.","cards":[{"s":"S-3307. Every line marked pass, both tester names and the timestamp present. The connectivity section just says “Pass,” with no throughput or latency figures.","o":[{"t":"Approve","w":"A pass recorded without the underlying figures isn’t evidence and won’t survive audit (SOP-GSOC-004)."},{"t":"Hold until the measured values are recorded","ok":true,"w":"Measured values are part of the record. Send it back to the Platform SME."}]},{"s":"S-3311. Camera 2 gives an unusable image after dark. The client’s lighting fix is booked for next week and they want the site live tonight.","o":[{"t":"Approve, with the gap noted in passdown","w":"That’s going live with an open item, which the control forbids outright."},{"t":"Hold it out of production","ok":true,"w":"Every camera has to produce a usable image across the full range of light, including night. Schedule pressure isn’t a basis for accepting a site (SOP-GSOC-004)."}]},{"s":"S-3315. Talk-down failed. The SME fixed the amplifier, re-tested only talk-down, and it passed.","o":[{"t":"Approve","w":"Re-testing the failed item alone isn’t accepted."},{"t":"Hold for a full re-run","ok":true,"w":"Any failed item is remediated and the full test is run again. Partial passes don’t count (SOP-GSOC-004)."}]},{"s":"S-3320. Full pass from the production console, measured values recorded, QA has reviewed the record, and the matrix has a verified primary and alternate at every level.","o":[{"t":"Approve, then tell the floor the effective date and time","ok":true,"w":"That’s the sequence: QA review, your approval, matrix finalized, floor notified (SOP-GSOC-004)."},{"t":"Hold for a second QA review","w":"Nothing’s missing. Holding a site that passed just delays coverage the client is paying for."}]},{"s":"S-3324. The test was run by the SME and an operator from the training-room test rig, because the production consoles were busy.","o":[{"t":"Approve","w":"The test rig isn’t the production console."},{"t":"Hold until it’s run from a production console","ok":true,"w":"The operator confirms every camera and path from the production console, not a test rig (SOP-GSOC-004)."}]}]}},{"act":{"id":"u3k","type":"check","title":"Check yourself","qs":[{"q":"The client confirms in writing that site S-1180 closes for good on Friday at 18:00. What happens to its records?","o":[{"t":"Delete them Friday so nothing lingers.","w":"Retiring a site doesn’t delete its records. Retention obligations survive the end of monitoring (SOP-GSOC-003)."},{"t":"They’re archived and kept under the retention schedule, and longer if a legal hold is in force.","w":"Records outlive the site, and a hold outlives the contract (SOP-GSOC-003, SOP-GSOC-018)."},{"t":"They transfer to the client.","w":"Records leave the GSOC only through the Program Director’s disclosure process (SOP-GSOC-018)."},{"t":"Keep them indefinitely, to be safe.","w":"Holding records past their period is a data-protection exposure, not a safe choice (SOP-GSOC-018)."}],"a":1,"r":"SOP-GSOC-003"},{"q":"A contract amendment adds two sites effective Monday at 00:00. When do you brief the floor?","o":[{"t":"Before Monday 00:00.","w":"The floor is briefed before a change takes effect, never after (SOP-GSOC-003)."},{"t":"At Monday’s day-shift start.","w":"That’s seven hours after the change. Overnight operators would be holding sites nobody told them about."},{"t":"Once the new sites have produced a few alerts.","w":"That’s learning about scope from incidents."},{"t":"At the next 90-day manual review.","w":"The annex revision comes with the amendment, not on the review cycle."}],"a":0,"r":"SOP-GSOC-003"},{"q":"Who approves a site for go-live?","o":[{"t":"The Platform SME, once the acceptance test passes.","w":"The SME runs the test with an operator. QA reviews it, and the go-live approval is the Supervisor’s."},{"t":"The Program Director.","w":"The Director approves the annex. Site go-live is yours."},{"t":"You, after QA independently reviews the acceptance record.","w":"Right. QA review, then Supervisor approval (SOP-GSOC-004)."},{"t":"The client.","w":"The client confirms the site list in writing. They don’t certify technical readiness."}],"a":2,"r":"SOP-GSOC-004"}]}}]},{"id":"u4","n":4,"short":"Readiness, the floor, handover","title":"Readiness, the floor, and handover","refs":["SOP-GSOC-005","SOP-GSOC-006","SOP-GSOC-009","Appendix D"],"lede":"Shift start, the long middle, and the handover. Operators run the checklists. You resolve what the checklists find, keep every console covered, and countersign the passdown that moves accountability from one person to the next.","blocks":[{"h":"Readiness is declared to you"},{"p":"Every operator runs the same readiness sequence and declares readiness to the Shift Lead or to you, with a timestamp. Any failed check gets reported before readiness is declared, never resolved quietly or put off until it’s quiet. One camera down at a low-criticality site is logged, reported, and monitored with the gap recorded. A dispatch channel down, the incident system unavailable, or several sites dark is a Level 2 to you and a trigger for degraded operations under SOP-GSOC-013."},{"p":"Staffing gaps are yours. An operator doesn’t silently absorb an unassigned console. Credentials are never shared, under any circumstance, and a forgotten password is a Shift Lead matter, which means it’s yours on a floor without one."},{"act":{"id":"u4o","type":"order","title":"Put shift start in order","intro":"These are the nine readiness checks from SOP-GSOC-005, scrambled. Put them in sequence. Use the arrows, or drag on a desktop.","steps":[{"t":"Arrive and sign on with your console assignment","w":"Late arrival goes to the Shift Lead right away so coverage holds."},{"t":"Inspect the workstation","w":"Displays, inputs, headset, nothing blocking a monitor."},{"t":"Authenticate with your own credentials","w":"Never shared or borrowed, including when a password’s forgotten."},{"t":"Run the platform health check","w":"Every site live. A frozen feed looks normal, so confirm motion or timestamp progression."},{"t":"Verify communications with a test call","w":"Dispatch, floor, and escalation channels. A lit indicator isn’t a test."},{"t":"Verify the escalation matrix for your sites","w":"Entries present, verification dates current, no gaps at any level."},{"t":"Read the passdown in full","w":"Open incidents, watch sites, known technology issues."},{"t":"Review open incidents","w":"Current status and next action for each."},{"t":"Declare readiness and record it","w":"Last, after every failed check has been reported."}]}},{"h":"Between alerts"},{"ctrl":"An unattended console is an unmonitored client. Coverage is arranged before the operator stands up, not after.","src":"SOP-GSOC-006"},{"p":"Breaks are a control, not a courtesy, and they don’t get skipped to clear a backlog. Rotate consoles across a long shift where staffing lets you. When someone tells you they’re fatigued, treat it as the professional obligation the SOP says it is. Vigilance drops over a shift no matter how good the operator is, and the manual is built around that fact."},{"p":"One number tells you a lot about your floor: operator-initiated detections as a share of actionable events. If it’s near zero, the GSOC has turned into a passive alarm receiver."},{"act":{"id":"u4d","type":"decide","title":"Floor calls","intro":"Five moments from one overnight. Make the call.","cards":[{"s":"05:52. An incoming operator forgot his password. The outgoing operator offers to leave her session open for him.","o":[{"t":"Allow it until IT resets him","w":"Shared or borrowed credentials are never used, under any circumstance (SOP-GSOC-005)."},{"t":"No shared session. Get his access reset, and keep the console covered by a certified operator logged in as themselves","ok":true,"w":"A forgotten password is a Shift Lead matter, which makes it yours where there isn’t one. The console stays covered by a named operator on their own login."}]},{"s":"03:50. Priya tells you she’s struggling to stay alert and caught herself drifting on the wall.","o":[{"t":"Thank her, arrange cover, and get her on a break or a rotation","ok":true,"w":"Reporting fatigue is a professional obligation and it’s treated that way (SOP-GSOC-006)."},{"t":"Tell her to grab a coffee and push through to 06:00","w":"That leaves a console with an operator who’s just told you she isn’t fully watching it."},{"t":"Note it for her next review","w":"Penalize the report and you won’t hear the next one."}]},{"s":"A call-out leaves console 4 unassigned. Marcus on console 3 says he’ll just watch both.","o":[{"t":"Let him, and keep it informal","w":"An operator doesn’t silently absorb an unassigned console. The gap is yours to resolve (SOP-GSOC-005)."},{"t":"Resolve it yourself: assign the coverage by name and record it","ok":true,"w":"Every console has exactly one named accountable operator at every moment, on the record (SOP-GSOC-005, SOP-GSOC-009)."},{"t":"Leave console 4 dark until day shift","w":"An unattended console is an unmonitored client (SOP-GSOC-006)."}]},{"s":"It’s busy. An operator says she’ll skip her 02:00 break to clear the backlog.","o":[{"t":"Fine, she can take it later","w":"Breaks are a control and aren’t skipped to clear a backlog (SOP-GSOC-006)."},{"t":"Arrange cover and send her on the break","ok":true,"w":"Cover first, then the break. The backlog is a staffing question for you, not a reason to burn her attention."}]},{"s":"06:58. The incoming operator says the passdown doesn’t cover two of the open incidents. The outgoing operator has his coat on.","o":[{"t":"Let him go and have the incoming read the records","w":"The outgoing operator doesn’t leave the floor until acceptance is recorded (SOP-GSOC-009)."},{"t":"He stays until it’s resolved. If they still disagree, you decide before he leaves and log the exception","ok":true,"w":"An unresolved dispute is a Supervisor decision made before the outgoing operator leaves. An incomplete handover is logged as an exception and reviewed (SOP-GSOC-009)."}]}]}},{"h":"The passdown you countersign"},{"p":"The written passdown supports the verbal handover. It doesn’t replace it, and a passdown emailed to an inbox isn’t a handover. Each open incident and each watch site gets walked individually, and the incoming operator asks questions until they can state every open item back. They run their own readiness check, then accept by name and timestamp. You review the passdown and countersign."},{"ctrl":"There is no gap and no overlap of accountability. At every instant, exactly one named operator is accountable for each console.","src":"SOP-GSOC-009","note":"Accountability transfers at the moment of recorded acceptance, not at the shift boundary on the roster."},{"act":{"id":"u4h","type":"hotspot","title":"Review the passdown","intro":"This passdown is waiting for your countersignature. Five lines have problems. Click every line you’d send back.","doc":{"title":"Shift passdown","meta":"Plano floor. Overnight to day, 2026-10-26"},"lines":[{"t":"Date / shift / floor: 2026-10-26, Overnight to Day, Plano"},{"t":"Outgoing: D. Okafor      Incoming: [blank]","f":"The incoming operator has to be named. Acceptance is by name and timestamp, and right now nobody has accepted anything (SOP-GSOC-009, Appendix D)."},{"t":"Consoles and sites: Console 2. S-2210, S-2214, S-3307, S-5521"},{"t":"Alert volume: 214      Actionable events: 3"},{"t":"Open incidents: INC-30418, officer on scene. Next: get disposition by 07:30"},{"t":"INC-30422, INC-30425: nothing major","f":"Each open incident needs its current status, last action, and next action. “Nothing major” is exactly the summary the SOP tells operators not to give (SOP-GSOC-009)."},{"t":"Escalations: L3 to on-site officer, INC-30418, 04:52. Closed out: no"},{"t":"Technology issues: [blank]","f":"Every repeating field needs an explicit “none.” A blank could mean nothing to report or not completed, and that ambiguity is exactly what fails at handover (Appendix D)."},{"t":"Degraded operations in force: No"},{"t":"Watch sites: S-5521, cam 2 frozen since 03:10, keep an eye on it","f":"A frozen camera is a technology fault. It belongs under technology issues with the time raised, current state, and a ticket reference. A watch site needs the specific reason and what to look for, and “keep an eye on it” is neither (SOP-GSOC-009, SOP-GSOC-013)."},{"t":"Client commitments: callback to client LP on INC-30409, completed 05:40"},{"t":"Verbal handover: sent by email 06:45","f":"A passdown emailed to an inbox isn’t a handover. The verbal handover happens face to face or on a live channel during the overlap (SOP-GSOC-009). [CONFIRM] overlap duration."},{"t":"Supervisor countersignature: [awaiting]"}],"verdict":{"q":"So, do you countersign?","o":[{"t":"Yes. The gaps are small and day shift can catch up.","w":"Your countersignature says the handover met standard. It didn’t."},{"t":"No. Keep the outgoing operator on the floor, get the five items fixed, run the verbal handover, record the named acceptance, then countersign.","w":"The outgoing operator doesn’t leave until acceptance is recorded, and a handover that couldn’t be completed properly gets logged as an exception (SOP-GSOC-009)."},{"t":"Countersign and add a note for the day supervisor.","w":"A note doesn’t change what your signature certifies."}],"a":1}}},{"act":{"id":"u4k","type":"check","title":"Check yourself","qs":[{"q":"The roster says day shift starts at 07:00. The incoming operator accepts the passdown at 07:12. Who’s accountable for console 2 at 07:05?","o":[{"t":"The incoming operator, from 07:00.","w":"Accountability doesn’t follow the roster."},{"t":"The outgoing operator, until acceptance is recorded at 07:12.","w":"Accountability transfers at the moment of recorded acceptance (SOP-GSOC-009)."},{"t":"Both of them, during the overlap.","w":"There’s no overlap of accountability. Exactly one named operator at every instant."},{"t":"You, as Supervisor.","w":"You countersign. The console’s accountable person is still a named operator."}],"a":1,"r":"SOP-GSOC-009"},{"q":"At shift start the dispatch channel test call fails. What’s the right sequence?","o":[{"t":"Declare readiness, then retry the test later.","w":"Failed checks are reported before readiness, never deferred to “when it gets quiet” (SOP-GSOC-005)."},{"t":"The operator reports it before declaring readiness. It’s a Level 2 to you and a trigger for degraded operations.","w":"A dispatch channel down is a critical readiness failure (SOP-GSOC-005, SOP-GSOC-013)."},{"t":"The operator emails the Platform SME and carries on.","w":"Email is never for urgent matters, and the floor would be running without a dispatch path nobody’s declared."},{"t":"Dispatch from a personal phone until it’s fixed.","w":"Personal devices are prohibited at the console. You switch to the documented fallback and confirm it works first (SOP-GSOC-006, SOP-GSOC-013)."}],"a":1,"r":"SOP-GSOC-005"},{"q":"Which number tells you your floor has become a passive alarm receiver?","o":[{"t":"Alert acknowledgement time.","w":"That measures response to alerts, not attention between them."},{"t":"Operator-initiated detections as a share of actionable events, sitting near zero.","w":"It measures proactive value. Near zero means nobody’s watching between alerts (SOP-GSOC-006)."},{"t":"False-alert ratio.","w":"That’s about detection quality, not operator attention."},{"t":"Patrol sweep completion.","w":"Useful, but sweeps can be logged without anything being noticed."}],"a":1,"r":"SOP-GSOC-006"}]}}]},{"id":"u5","n":5,"short":"Verification calls and surges","title":"Verification calls and surges","refs":["SOP-GSOC-007","SOP-GSOC-001 6.1","6.2"],"lede":"Unresolved isn’t a disposition. It’s a trigger, and it triggers you. When an operator can’t classify an alert from the view they have, the Level 2 determination is yours, and the same standards that bind them bind you.","blocks":[{"h":"Three outcomes, no fourth"},{"p":"Every verified alert lands in exactly one class. A non-actionable false alert is logged and closed with its specific cause. An actionable non-life-safety event goes to dispatch under SOP-GSOC-010. An actionable life-safety event goes to SOP-GSOC-011 immediately, in parallel with dispatch. There’s no “unsure.” An alert that can’t be resolved comes to you."},{"ctrl":"Where verification is inconclusive and a life-safety outcome is plausible, the operator escalates as if it were a life-safety event. Over-escalation is recoverable; under-escalation is not.","src":"SOP-GSOC-007","note":"When it’s on your desk, the same rule applies to you. You don’t get a higher threshold because you’re the Supervisor."},{"h":"Facts, not assumptions"},{"p":"An operator can record that a subject is carrying an object and describe it. They can’t record a weapon unless the object is clearly identifiable as one. That isn’t pedantry. It decides what emergency services are told and what the responding officer expects to walk into. The same goes for plates: capture them only where they’re legible, because a half-guessed plate is worse than none."},{"act":{"id":"u5s","type":"sort","title":"Record it or rewrite it?","intro":"Lines from verification notes on your floor. Which ones can stand, and which go back?","bins":[{"id":"ok","label":"Record it"},{"id":"re","label":"Rewrite it"}],"items":[{"t":"Subject carried an elongated object about 60 cm long, not identifiable from the available view.","b":"ok","w":"Describes what’s visible and says what isn’t known (SOP-GSOC-008)."},{"t":"Subject was armed.","b":"re","w":"Only if the object is clearly identifiable as a weapon. Otherwise it changes what police and the officer expect to meet (SOP-GSOC-007)."},{"t":"Subject appeared to be casing the lot.","b":"re","w":"That’s intent. Describe the behavior instead: where they walked, how long, what they stopped at."},{"t":"Subject walked the fence line twice between 01:12 and 01:19, stopping at the northeast gate each time.","b":"ok","w":"Observable, timed, and specific."},{"t":"Plate looked like 7KX-482, last two characters hard to make out.","b":"re","w":"Plates are captured only where legible. A partially guessed plate is worse than none (SOP-GSOC-007)."},{"t":"False-alert cause: false alarm.","b":"re","w":"“False alarm” isn’t a cause. The false-alert ratio and any detection tuning depend on the specific cause (SOP-GSOC-001)."},{"t":"False-alert cause: vegetation movement in wind, camera 3 field of view.","b":"ok","w":"Specific enough to tune against."},{"t":"Two sketchy-looking guys hanging around the trailers.","b":"re","w":"Opinion and characterization. Count, location, behavior, and objective description only."}]}},{"h":"Bias and complacency"},{"p":"Classify on observed behavior only. A subject’s personal characteristics are never a basis for classification, which is a matter of legal exposure and basic competence at the same time. A site with a long false-alert history isn’t exempt from verification either. Documented non-event patterns live in the site profile, not in an operator’s memory, and QA samples high-false-alert sites on purpose to catch exactly this."},{"p":"Second opinions are encouraged, recorded, and never treated as a deficiency. If an operator thinks asking you for a look will count against them, they’ll stop asking. Keep it cheap."},{"h":"Surges"},{"p":"When alerts stack up, operators sort by potential life safety first and site criticality second, and they tell you a surge is running. An alert that can’t be acknowledged because the console or platform has stopped responding is an immediate Level 2 and a trigger for degraded operations."},{"act":{"id":"u5d","type":"decide","title":"Level 2 on your desk","intro":"Operators bring you five calls. Make each determination.","cards":[{"s":"02:40, S-4417. A person is lying still beside a parked car. The operator can’t tell whether they’re hurt or asleep. Nobody else is around.","o":[{"t":"Treat it as life-safety. The operator calls emergency services now and you take the parallel notifications","ok":true,"w":"Inconclusive with a plausible life-safety outcome is escalated as life-safety. Over-escalation is recoverable (SOP-GSOC-007)."},{"t":"Have the operator watch for movement for ten minutes","w":"Ten minutes of watching is the under-escalation the control exists to stop."},{"t":"Send the on-site officer to check, then decide","w":"An officer is never the sole response where life safety is plausible (SOP-GSOC-010)."}]},{"s":"S-2214 logged 40 vegetation false alerts this month. An operator wants to close the latest one as “bushes again,” going from memory.","o":[{"t":"Fine, everyone knows that site","w":"Operator memory isn’t a documented pattern, and a false-alert history doesn’t exempt a site from verification (SOP-GSOC-001, SOP-GSOC-007)."},{"t":"Check the site profile. If this alert doesn’t match a documented non-event pattern there, verify it like any other","ok":true,"w":"Triage can lean on patterns documented in the site profile. Nothing else replaces looking. QA samples for this complacency on purpose (SOP-GSOC-015)."}]},{"s":"An operator’s verification note reads: “Subject looks like a gang member, probably scoping the yard.”","o":[{"t":"Leave it. It’s useful context for the officer","w":"Personal characteristics are never a basis for classification. That’s legal exposure and a competence problem (SOP-GSOC-007)."},{"t":"Have it rewritten to observed behavior only, and check the classification still holds on behavior alone","ok":true,"w":"Behavior is the only basis. If the classification falls apart without the label, it was wrong."}]},{"s":"Kai asks Dee for a second look at an alert, then apologizes to you for slowing things down.","o":[{"t":"Tell him it’s fine and make sure the second opinion is recorded","ok":true,"w":"Second opinions are encouraged, recorded, and never a deficiency (SOP-GSOC-007)."},{"t":"Tell him to be more decisive next time","w":"That makes asking expensive. Operators who don’t ask make worse calls alone."}]},{"s":"01:15. Four alerts in 90 seconds: motion at a high-criticality distribution center gate, a person slumped against a wall at a low-criticality store, a car idling with its lights off at a medium site, and a fence line that deer love.","o":[{"t":"The distribution center gate first. It’s the highest criticality","w":"Criticality is the second sort, not the first (SOP-GSOC-001)."},{"t":"The slumped person first, then the distribution center, then the rest by criticality","ok":true,"w":"Potential life safety first, site criticality second, and the operator tells you a surge is running (SOP-GSOC-001, 6.1)."},{"t":"Oldest alert first","w":"Arrival order isn’t the rule."}]}]}},{"act":{"id":"u5k","type":"check","title":"Check yourself","qs":[{"q":"An operator marks an alert “unsure, will revisit.” What’s wrong with that?","o":[{"t":"Nothing, as long as it’s revisited within the hour.","w":"There’s no “unsure” disposition to come back to."},{"t":"There’s no unsure disposition. It’s a Level 2 for your determination, right now.","w":"Exactly three outcomes. An alert that can’t be resolved is escalated for a supervisor determination (SOP-GSOC-001, 6.2)."},{"t":"It should be marked false until proven otherwise.","w":"That’s a classification without verification, the opposite of the standard."},{"t":"It should go to the next shift in passdown.","w":"That hands an unresolved, possibly live event to someone who hasn’t seen it."}],"a":1,"r":"SOP-GSOC-001"},{"q":"An operator wants to brighten and crop the original clip so the plate’s readable for the client. Your answer?","o":[{"t":"Go ahead, it’s the same footage.","w":"Source material is never edited, cropped, enhanced, or annotated (SOP-GSOC-007, SOP-GSOC-018)."},{"t":"The original stays untouched. Any working copy is marked as a copy, and a release to the client goes through the Program Director.","w":"Chain of custody depends on the original being unaltered, and external releases route through the Program Director (SOP-GSOC-018)."},{"t":"Crop it, but don’t brighten it.","w":"Cropping is altering. Same answer."},{"t":"Export the enhanced version and delete the original to save space.","w":"That destroys the evidence and the chain of custody in one step."}],"a":1,"r":"SOP-GSOC-018"},{"q":"Why does the manual care whether a note says “carrying a weapon” or “carrying an object”?","o":[{"t":"It’s a legal style preference.","w":"It’s a safety issue first."},{"t":"It decides what emergency services are told and what the responding officer expects to meet.","w":"That’s the reason given in SOP-GSOC-007."},{"t":"Shorter notes are easier for QA.","w":"Length isn’t the point."},{"t":"Clients prefer neutral language.","w":"Client preference doesn’t drive verification standards."}],"a":1,"r":"SOP-GSOC-007"}]}}]},{"id":"u6","n":6,"short":"Review and closure","title":"Review and closure","refs":["SOP-GSOC-008","SOP-GSOC-001 6.5","SOP-GSOC-000 A8","Appendix E"],"lede":"The record is the deliverable. Monitoring that isn’t documented can’t be billed, can’t be defended, and in a dispute it didn’t happen. Closure is a supervisory act, and your name goes on it.","blocks":[{"h":"What you check before you close"},{"ul":["The record was opened at acknowledgement, not after the outcome was known. Alert time and acknowledgement time are separate values.","Verification shows the classification, the observations behind it, and evidence references. A false alert names its specific cause.","Every action has its own full timestamp, date included. No “ten minutes later.”","Every attempted contact is logged, not just the ones that connected.","Every escalation shows a level, recipient, channel, and time.","The narrative gives the source of each fact, never presents inference as observation, and never characterizes intent.","No field is blank. Anything not applicable says so, with a reason.","Deviations are recorded with reasons, and you’ve reviewed each one."]},{"p":"Then you either approve closure or return the record with the specific deficiencies listed. “Needs work” isn’t a return. Closure gets recorded with your identity and the time."},{"ctrl":"An operator does not close their own incident. Review before closure is the control that keeps documentation quality from drifting, and it is never waived for a busy shift.","src":"SOP-GSOC-008"},{"act":{"id":"u6h","type":"hotspot","title":"Review the record","intro":"INC-30441 is in your queue for closure. Seven lines have problems. Click every line you’d return.","doc":{"title":"INC-30441","meta":"Site S-2210, yard. Operator J. Pike. Submitted for closure 06:31"},"lines":[{"t":"Alert presented 2026-10-26 01:47:10. Motion, Yard Cam 3"},{"t":"Acknowledged 2026-10-26 01:47:32"},{"t":"Record opened 2026-10-26 01:58:05","f":"The record opened eleven minutes after acknowledgement, after verification had finished. It’s opened at acknowledgement so the timing evidence exists at all (SOP-GSOC-001, 6.1)."},{"t":"01:49 to 01:55 Verification: live and recorded review, Cams 3 and 4"},{"t":"01:52 Two subjects entered through the northeast gate and approached the equipment row."},{"t":"01:53 Subject 2 had a crowbar and was clearly there for the generator.","f":"“Clearly there for the generator” is a statement of intent, which a record never contains. Describe the object as seen and say whether it was identifiable from the view (SOP-GSOC-008)."},{"t":"01:56 Classified actionable, non-life-safety."},{"t":"01:56 Officer called on primary. No answer."},{"t":"A few minutes later the officer called back and was briefed.","f":"Relative times aren’t usable in evidence, and the callback and the brief are two separate actions that each need a full timestamp. There’s also no attempt on the alternate, which should have been tried immediately after the primary went unanswered (SOP-GSOC-008, SOP-GSOC-010)."},{"t":"Brief given: NE gate, two subjects, no weapons.","f":"“No weapons” and “no weapon observed” aren’t the same thing. The officer has to know which one they’re being told (SOP-GSOC-010)."},{"t":"02:05 Client notified.","f":"Who was reached, and on what channel? Every notification r
